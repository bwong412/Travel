<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Travel Map</title>
  
  <!-- Supabase, D3 & TopoJSON Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-array@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

  <!-- Space Mono Font -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #000000;
      --panel-bg: rgba(12, 12, 12, 0.92);
      --glyph-white: #ffffff;
      --glyph-red: #D71921;
      --border-color: rgba(255, 255, 255, 0.15);
      --text-muted: #888888;
      --canvas-bg: #000000;
      --land-bg: #0d0d0d;
      --stroke-color: #262626;
      --grid-color: #181818;
    }

    body.theme-sand {
      --bg-color: #f4efea;
      --panel-bg: rgba(244, 239, 234, 0.94);
      --glyph-white: #1a1714;
      --glyph-red: #c83226;
      --border-color: rgba(0, 0, 0, 0.15);
      --text-muted: #7a736c;
      --canvas-bg: #e8e2d8;
      --land-bg: #d8cfc0;
      --stroke-color: #b5a895;
      --grid-color: #cbc1b1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Mono', monospace, -apple-system, "PingFang HK", "Microsoft JhengHei"; user-select: none; }
    html, body { width: 100%; height: 100%; background-color: var(--bg-color); color: var(--glyph-white); overflow: hidden; touch-action: none; transition: background-color 0.3s ease; }

    #world-canvas {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--canvas-bg); z-index: 1; cursor: grab;
    }
    #world-canvas:active { cursor: grabbing; }

    /* Tooltip 懸浮框 */
    .country-tooltip {
      position: absolute; display: none; pointer-events: none; z-index: 3000;
      background: rgba(15, 15, 15, 0.92); border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff; padding: 6px 14px; font-size: 11px; font-weight: bold;
      letter-spacing: 1.5px; border-radius: 4px; box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px); transform: translate(15px, 15px); transition: opacity 0.2s ease; white-space: nowrap;
    }

    /* Top Navigation Bar */
    .top-nav {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--border-color);
      backdrop-filter: blur(16px); padding: 4px 8px; border-radius: 30px;
      display: flex; gap: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-width: 90vw;
    }
    .nav-btn {
      background: transparent; border: none; color: var(--text-muted); font-size: 10px;
      padding: 6px 12px; cursor: pointer; border-radius: 20px; letter-spacing: 1px;
      transition: all 0.2s; font-weight: bold; white-space: nowrap;
    }
    .nav-btn:hover, .nav-btn.active { background: var(--glyph-white); color: var(--bg-color); }

    /* Controls Bar Top Right */
    .top-right-controls {
      position: absolute; top: 15px; right: 15px; z-index: 1000;
      display: flex; gap: 8px; align-items: center;
    }

    .mode-btn, .admin-btn {
      background: var(--panel-bg); border: 1px solid var(--border-color);
      color: var(--glyph-white); padding: 8px 12px; font-size: 9px;
      cursor: pointer; backdrop-filter: blur(12px); border-radius: 4px;
      letter-spacing: 1px; transition: all 0.2s; font-family: 'Space Mono', monospace;
    }
    .mode-btn:hover, .admin-btn:hover { border-color: var(--glyph-white); }
    .admin-btn.active { border-color: var(--glyph-red); color: var(--glyph-red); }

    /* Dashboard Panel */
    .dashboard {
      position: absolute; top: 15px; left: 15px; z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--border-color);
      backdrop-filter: blur(16px); padding: 14px; border-radius: 8px; width: 230px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3); pointer-events: auto;
    }
    .brand-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px dashed var(--border-color); padding-bottom: 8px; margin-bottom: 10px; }
    .brand-title { font-size: 11px; letter-spacing: 1.5px; font-weight: bold; }
    .red-dot { width: 6px; height: 6px; background-color: var(--glyph-red); border-radius: 50%; box-shadow: 0 0 8px var(--glyph-red); }
    .stat-number { font-size: 28px; font-weight: bold; }
    .stat-label { font-size: 9px; color: var(--text-muted); letter-spacing: 1px; }

    /* 分類 Filter 按鈕 */
    .filter-container { margin-top: 12px; border-top: 1px dashed var(--border-color); padding-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .filter-chip {
      background: rgba(0,0,0,0.05); border: 1px solid var(--border-color); color: var(--text-muted);
      font-size: 10px; padding: 6px 9px; cursor: pointer; border-radius: 4px; letter-spacing: 0.5px; font-weight: bold;
      transition: all 0.15s ease;
    }
    .filter-chip:hover, .filter-chip.active { background: var(--glyph-white); color: var(--bg-color); font-weight: bold; border-color: var(--glyph-white); }

    /* 左側慢慢向下拉出來的 Filter 抽屜選單 (Pack Drawer) */
    .pack-drawer {
      display: none; position: absolute; top: 250px; left: 15px; z-index: 999;
      background: var(--panel-bg); border: 1px solid var(--border-color);
      backdrop-filter: blur(20px); border-radius: 8px; width: 230px; max-height: 45vh;
      overflow-y: auto; padding: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      animation: slideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .drawer-title { font-size: 10px; font-weight: bold; color: var(--glyph-white); letter-spacing: 1px; margin-bottom: 8px; border-bottom: 1px dashed var(--border-color); padding-bottom: 6px; }
    .drawer-country { font-size: 10px; font-weight: bold; color: var(--glyph-white); margin-top: 8px; }
    .drawer-cities { font-size: 9px; color: var(--text-muted); margin-bottom: 6px; line-height: 1.4; word-break: break-word; }

    .manage-btn {
      width: 100%; margin-top: 12px; background: transparent; border: 1px solid var(--border-color);
      color: var(--text-muted); font-size: 8px; padding: 4px; cursor: pointer; letter-spacing: 0.8px; text-align: center;
      border-radius: 3px; font-family: 'Space Mono', monospace; transition: all 0.2s;
    }
    .manage-btn:hover { border-color: var(--glyph-white); color: var(--glyph-white); }

    /* 主頁底部高級能量探索進度條 */
    .bottom-world-progress {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000;
      width: clamp(320px, 42vw, 520px); background: var(--panel-bg);
      border: 1px solid var(--border-color); backdrop-filter: blur(20px);
      padding: 10px 18px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      display: flex; flex-direction: column; gap: 7px; pointer-events: auto;
    }

    .progress-text-row { display: flex; justify-content: space-between; align-items: center; font-size: 10px; letter-spacing: 1px; font-weight: bold; white-space: nowrap; }
    .progress-title { color: var(--text-muted); }
    .progress-val { color: var(--glyph-white); }

    .energy-bar-bg { width: 100%; height: 4px; background: rgba(128, 128, 128, 0.2); border-radius: 3px; overflow: hidden; position: relative; }
    .energy-bar-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #80D8FF 0%, var(--glyph-white) 50%, #FF5252 100%);
      border-radius: 3px; transition: width 1s cubic-bezier(0.16, 1, 0.3, 1); position: relative;
    }

    /* Modals */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 2000;
      justify-content: center; align-items: center;
    }
    .modal {
      background: var(--panel-bg); border: 1px solid var(--border-color); color: var(--glyph-white);
      padding: 20px; width: 340px; max-height: 80vh; overflow-y: auto; border-radius: 8px; box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }
    .modal h3 { font-size: 11px; margin-bottom: 12px; letter-spacing: 1px; color: var(--glyph-white); border-bottom: 1px dashed var(--border-color); padding-bottom: 8px; }
    .modal label { font-size: 9px; color: var(--text-muted); letter-spacing: 1px; display: block; margin-top: 10px; margin-bottom: 4px; font-weight: bold; }
    .modal input, .modal select {
      width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color);
      color: var(--glyph-white); padding: 8px; margin-bottom: 8px; font-size: 11px;
      font-family: 'Space Mono', monospace; border-radius: 4px; user-select: text;
    }
    .setting-group { display: flex; gap: 6px; margin-bottom: 12px; }
    .setting-opt {
      flex: 1; padding: 8px; border: 1px solid var(--border-color); background: transparent;
      color: var(--text-muted); font-size: 10px; font-weight: bold; cursor: pointer; border-radius: 4px; text-align: center;
      transition: all 0.2s;
    }
    .setting-opt.active { background: var(--glyph-white); color: var(--bg-color); border-color: var(--glyph-white); }

    .modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
    .btn { flex: 1; padding: 8px; background: var(--glyph-white); color: var(--bg-color); border: none; font-weight: bold; cursor: pointer; font-size: 10px; letter-spacing: 1px; border-radius: 4px; }
    .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }

    /* Country Cards View */
    .cards-view-overlay { display: none; position: fixed; top: 70px; left: 0; width: 100vw; height: calc(100vh - 70px); z-index: 1500; background: var(--canvas-bg); padding: 20px; overflow-y: auto; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
    .flip-card-container { perspective: 1000px; height: 380px; cursor: pointer; }
    .flip-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
    .flip-card-container.flipped .flip-card-inner { transform: rotateY(180deg); }
    .deep-card-front, .deep-card-back { position: absolute; inset: 0; width: 100%; height: 100%; -webkit-backface-visibility: hidden !important; backface-visibility: hidden !important; border-radius: 24px; overflow: hidden; border: 1px solid var(--border-color); box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
    .deep-card-front { background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; z-index: 2; }
    .deep-card-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.6) 45%, rgba(0,0,0,0.95) 100%); z-index: 1; }
    .deep-card-content { position: relative; z-index: 2; }
    .deep-card-title { font-size: 22px; font-weight: 700; letter-spacing: 1px; color: #ffffff; margin-bottom: 6px; }
    .deep-card-cities { font-size: 11px; color: #d0d0d0; line-height: 1.5; margin-bottom: 14px; min-height: 33px; }
    .deep-card-back { transform: rotateY(180deg); background-color: var(--panel-bg) !important; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; z-index: 1; }
    .flag-large-img { width: 150px; height: 100px; object-fit: cover; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.3); border: 1px solid var(--border-color); margin-bottom: 16px; }
    .flag-country-name { font-size: 18px; font-weight: bold; letter-spacing: 2px; color: var(--glyph-white); }

    @media (max-width: 600px) {
      .dashboard { top: 60px; left: 15px; width: calc(100vw - 30px); }
      .pack-drawer { top: 310px; left: 15px; width: calc(100vw - 30px); }
      .top-right-controls { top: 15px; right: 15px; }
      .bottom-world-progress { width: calc(100vw - 30px); bottom: 15px; }
    }
  </style>
</head>
<body>

  <!-- Tooltip 懸浮框 -->
  <div class="country-tooltip" id="country-tooltip"></div>

  <!-- Top Navigation -->
  <div class="top-nav">
    <button class="nav-btn active" id="btn-world" onclick="playClickSound(); switchView('MAP')">[ WORLD MAP ]</button>
    <button class="nav-btn" id="btn-cards" onclick="playClickSound(); switchView('CARDS')">[ COUNTRY CARDS ]</button>
  </div>

  <!-- Top Right Controls (Settings & Admin Login) -->
  <div class="top-right-controls">
    <button class="mode-btn" onclick="playClickSound(); openSettingsModal()">⚙️ SETTINGS</button>
    <button class="admin-btn" id="admin-btn" onclick="playClickSound(); openLoginModal()">[ LOGIN ]</button>
  </div>

  <!-- Dashboard Panel -->
  <div class="dashboard" id="main-dashboard">
    <div class="brand-header">
      <span class="brand-title">Travel Map</span>
      <div class="red-dot"></div>
    </div>
    <div class="stat-number" id="city-count">00</div>
    <div class="stat-label">CITIES UNLOCKED</div>

    <div class="filter-container">
      <div class="filter-chip active" onclick="playClickSound(); setFilter('ALL', this)">ALL</div>
      <div class="filter-chip" onclick="playClickSound(); setFilter('ASIA', this)">ASIA</div>
      <div class="filter-chip" onclick="playClickSound(); setFilter('EUROPE', this)">EUROPE</div>
      <div class="filter-chip" onclick="playClickSound(); setFilter('AMERICAS', this)">AMERICAS</div>
      <div class="filter-chip" onclick="playClickSound(); setFilter('AFRICA', this)">AFRICA</div>
      <div class="filter-chip" onclick="playClickSound(); setFilter('OCEANIA', this)">OCEANIA</div>
    </div>

    <button class="manage-btn" onclick="playClickSound(); openManageModal()">[ EDIT / DELETE CITIES ]</button>
  </div>

  <!-- 向下拉出的 Filter 洲際清單抽屜 (Pack Drawer) -->
  <div class="pack-drawer" id="pack-drawer">
    <div class="drawer-title" id="drawer-title">REGION // PACK</div>
    <div id="drawer-content"></div>
  </div>

  <!-- 主頁底部高級能量探索進度條 -->
  <div class="bottom-world-progress" id="world-progress-bar">
    <div class="progress-text-row">
      <span class="progress-title">WORLD EXPLORED</span>
      <span class="progress-val" id="world-progress-text">0 / 195 COUNTRIES (0.0%)</span>
    </div>
    <div class="energy-bar-bg">
      <div class="energy-bar-fill" id="world-progress-fill"></div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <h3>MAP & VISUAL SETTINGS</h3>
      
      <label>PROJECTION MODE (地圖模式)</label>
      <div class="setting-group">
        <button class="setting-opt active" id="opt-2d" onclick="playClickSound(); applySettingMode('2D')">2D MAP</button>
        <button class="setting-opt" id="opt-3d" onclick="playClickSound(); applySettingMode('3D')">3D GLOBE</button>
      </div>

      <label>COLOR THEME (視覺主題)</label>
      <div class="setting-group">
        <button class="setting-opt active" id="opt-theme-noir" onclick="playClickSound(); applyTheme('noir')">黑白經典</button>
        <button class="setting-opt" id="opt-theme-sand" onclick="playClickSound(); applyTheme('sand')">沙白黃金</button>
      </div>

      <label>REAL-TIME SUNLIGHT (實時日照)</label>
      <div class="setting-group">
        <button class="setting-opt active" id="opt-sun-off" onclick="playClickSound(); toggleSunlight(false)">OFF (極速)</button>
        <button class="setting-opt" id="opt-sun-on" onclick="playClickSound(); toggleSunlight(true)">ON (日照區域)</button>
      </div>

      <div class="modal-actions">
        <button class="btn" onclick="playClickSound(); closeSettingsModal()">DONE</button>
      </div>
    </div>
  </div>

  <!-- Login Modal -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal">
      <h3>ADMIN // AUTHENTICATION</h3>
      <label>EMAIL</label>
      <input type="email" id="login-email" placeholder="admin@example.com">
      <label>PASSWORD</label>
      <input type="password" id="login-password" placeholder="••••••••">
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="playClickSound(); closeLoginModal()">CANCEL</button>
        <button class="btn" id="login-submit-btn" onclick="playClickSound(); handleLogin()">LOGIN</button>
      </div>
    </div>
  </div>

  <!-- Manage Modal -->
  <div class="modal-overlay" id="manage-modal">
    <div class="modal">
      <h3>MANAGE UNLOCKED CITIES</h3>
      <div id="city-list-container"></div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="playClickSound(); closeManageModal()">CLOSE</button>
      </div>
    </div>
  </div>

  <!-- Country Cards View -->
  <div class="cards-view-overlay" id="cards-view">
    <div class="cards-grid" id="cards-container"></div>
  </div>

  <canvas id="world-canvas"></canvas>

  <script>
    /* 防快捷鍵與複製模組 */
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) ||
        (e.metaKey && e.altKey && ['I','i','J','j','C','c'].includes(e.key)) ||
        (e.ctrlKey && ['U','u','S','s'].includes(e.key)) ||
        (e.metaKey && ['U','u','S','s'].includes(e.key))
      ) {
        e.preventDefault(); e.stopPropagation(); return false;
      }
    });

    /* Supabase 與基礎配置 */
    const SUPABASE_URL = 'https://pmrhldqgabasvohsupbn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_R9BjF5Dl_puhHVzvPwd7sA_vwRJwO_E';

    let supabaseClient = null;
    try {
      if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch(e){}

    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playHoverSound() {
      try {
        initAudio(); if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.015, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.04);
      } catch(e){}
    }
    function playClickSound() {
      try {
        initAudio(); if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(320, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.06);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.06);
      } catch(e){}
    }

    let currentUser = null;
    let visitedCities = [];
    let currentFilter = 'ALL';
    let mapMode = '2D';
    let currentTheme = 'noir';
    let isSunlightOn = false;

    const TOTAL_WORLD_COUNTRIES = 195;

    /* 100% 精準靜態地標圖典 */
    const STATIC_LANDMARKS = {
      'CHINA': 'https://images.unsplash.com/photo-1508804185872-d7badad00f7d?w=800&auto=format&fit=crop',
      'JAPAN': 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=800&auto=format&fit=crop',
      'NEW ZEALAND': 'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=800&auto=format&fit=crop',
      'THAILAND': 'https://images.unsplash.com/photo-1508009603885-50cf7c579365?w=800&auto=format&fit=crop',
      'TAIWAN': 'https://images.unsplash.com/photo-1543783207-ec64e4d95325?w=800&auto=format&fit=crop',
      'USA': 'https://images.unsplash.com/photo-1485738422979-f5c462d49f74?w=800&auto=format&fit=crop',
      'UNITED STATES': 'https://images.unsplash.com/photo-1485738422979-f5c462d49f74?w=800&auto=format&fit=crop',
      'FIJI': 'https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=800&auto=format&fit=crop',
      'AUSTRALIA': 'https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?w=800&auto=format&fit=crop',
      'KOREA': 'https://images.unsplash.com/photo-1517154421773-0529f29ea451?w=800&auto=format&fit=crop',
      'SOUTH KOREA': 'https://images.unsplash.com/photo-1517154421773-0529f29ea451?w=800&auto=format&fit=crop',
      'SINGAPORE': 'https://images.unsplash.com/photo-1525625293386-3f8f99389edd?w=800&auto=format&fit=crop',
      'MALAYSIA': 'https://images.unsplash.com/photo-1596422846543-75c6fc197f07?w=800&auto=format&fit=crop',
      'GERMANY': 'https://images.unsplash.com/photo-1467269204594-9661b134dd2b?w=800&auto=format&fit=crop',
      'ITALY': 'https://images.unsplash.com/photo-1516483638261-f4dbaf036963?w=800&auto=format&fit=crop',
      'SWITZERLAND': 'https://images.unsplash.com/photo-1530122037265-a5f1f91d3b99?w=800&auto=format&fit=crop',
      'NORWAY': 'https://images.unsplash.com/photo-1507272931001-fc06c17e4f43?w=800&auto=format&fit=crop',
      'ICELAND': 'https://images.unsplash.com/photo-1504893524553-b855bce32c67?w=800&auto=format&fit=crop',
      'FINLAND': 'https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=800&auto=format&fit=crop',
      'NETHERLANDS': 'https://images.unsplash.com/photo-1512470876302-972faa2aa9a4?w=800&auto=format&fit=crop',
      'MALDIVES': 'https://images.unsplash.com/photo-1514282401047-d79a71a590e8?w=800&auto=format&fit=crop'
    };

    /* 100% 精準國旗 Code */
    const COUNTRY_FLAG_CODES = {
      'CHINA': 'cn', 'JAPAN': 'jp', 'NEW ZEALAND': 'nz', 'THAILAND': 'th', 'TAIWAN': 'tw',
      'USA': 'us', 'UNITED STATES': 'us', 'FIJI': 'fj', 'AUSTRALIA': 'au', 'MACAU': 'mo', 'HONG KONG': 'hk',
      'KOREA': 'kr', 'SOUTH KOREA': 'kr', 'SINGAPORE': 'sg', 'MALAYSIA': 'my', 'GERMANY': 'de',
      'ITALY': 'it', 'SWITZERLAND': 'ch', 'NORWAY': 'no', 'ICELAND': 'is', 'FINLAND': 'fi',
      'NETHERLANDS': 'nl', 'MALDIVES': 'mv', 'UNITED KINGDOM': 'gb', 'UK': 'gb', 'FRANCE': 'fr'
    };

    const COUNTRY_CN_NAME = {
      'JAPAN': '日本', 'CHINA': '中國', 'TAIWAN': '台灣', 'HONG KONG': '香港', 'MACAU': '澳門',
      'SOUTH KOREA': '韓國', 'KOREA': '韓國', 'THAILAND': '泰國', 'VIETNAM': '越南', 'MALAYSIA': '馬來西亞', 'SINGAPORE': '新加坡',
      'USA': '美國', 'UNITED STATES': '美國', 'CANADA': '加拿大', 'AUSTRALIA': '澳洲', 'NEW ZEALAND': '紐西蘭'
    };

    function cleanCountryName(str) { return str ? str.toString().toUpperCase().replace(/\s+/g, ' ').trim() : 'UNKNOWN'; }

    function getCountryImageUrl(countryName) {
      const cleaned = cleanCountryName(countryName);
      if (STATIC_LANDMARKS[cleaned]) return STATIC_LANDMARKS[cleaned];
      return `https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=800&auto=format&fit=crop`;
    }

    function updateWorldProgress() {
      const visitedCountrySet = new Set(visitedCities.map(c => cleanCountryName(c.country)));
      const visitedCount = visitedCountrySet.size;
      const percent = ((visitedCount / TOTAL_WORLD_COUNTRIES) * 100).toFixed(1);
      document.getElementById('world-progress-text').innerText = `${visitedCount} / ${TOTAL_WORLD_COUNTRIES} COUNTRIES (${percent}%)`;
      document.getElementById('world-progress-fill').style.width = `${Math.min(100, percent)}%`;
    }

    function openSettingsModal() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettingsModal() { document.getElementById('settings-modal').style.display = 'none'; }
    function openLoginModal() { document.getElementById('login-modal').style.display = 'flex'; }
    function closeLoginModal() { document.getElementById('login-modal').style.display = 'none'; }
    function openManageModal() { renderCityManageList(); document.getElementById('manage-modal').style.display = 'flex'; }
    function closeManageModal() { document.getElementById('manage-modal').style.display = 'none'; }

    /* Login 響應與認證處理 */
    async function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      const submitBtn = document.getElementById('login-submit-btn');

      if (!email || !password) return alert('請輸入 Email 與 Password！');
      if (!supabaseClient) return alert("Supabase 初始化失敗，請檢查網路連線！");

      submitBtn.innerText = 'LOGGING IN...';
      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          alert('登入失敗: ' + error.message);
          submitBtn.innerText = 'LOGIN';
        } else {
          currentUser = data.user;
          document.getElementById('admin-btn').innerText = '[ ADMIN ON ]';
          document.getElementById('admin-btn').classList.add('active');
          submitBtn.innerText = 'LOGIN';
          closeLoginModal();
          alert('登入成功！你現在可以雙擊地圖新增城市或進行管理。');
        }
      } catch(e) {
        alert('登入過程出錯: ' + e.message);
        submitBtn.innerText = 'LOGIN';
      }
    }

    /* Filter 抽屜選單 (Pack Drawer) 邏輯 */
    function setFilter(region, element) {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      element.classList.add('active');
      currentFilter = region;

      const drawer = document.getElementById('pack-drawer');
      const drawerTitle = document.getElementById('drawer-title');
      const drawerContent = document.getElementById('drawer-content');

      if (region === 'ALL') {
        drawer.style.display = 'none';
        return;
      }

      drawerTitle.innerText = `${region} // EXPLORED`;
      drawerContent.innerHTML = '';

      const filtered = visitedCities.filter(c => cleanCountryName(c.region) === region);
      const grouped = {};
      filtered.forEach(c => {
        const country = cleanCountryName(c.country);
        if (!grouped[country]) grouped[country] = [];
        grouped[country].push(c.city_name);
      });

      const countries = Object.keys(grouped);
      if (countries.length === 0) {
        drawerContent.innerHTML = '<div style="font-size:9px; color:var(--text-muted);">NO CITIES IN THIS REGION YET.</div>';
      } else {
        countries.forEach(country => {
          const div = document.createElement('div');
          div.innerHTML = `
            <div class="drawer-country">> ${country}</div>
            <div class="drawer-cities">${grouped[country].join(', ')}</div>
          `;
          drawerContent.appendChild(div);
        });
      }

      drawer.style.display = 'block';
    }

    function applySettingMode(mode) {
      mapMode = mode;
      document.getElementById('opt-2d').classList.toggle('active', mode === '2D');
      document.getElementById('opt-3d').classList.toggle('active', mode === '3D');
      if (mode === '3D') {
        projection = d3.geoOrthographic().scale(Math.min(width, height) / 2.4).translate([width / 2, height / 2]).clipAngle(90);
      } else {
        projection = d3.geoMercator().scale(width / 6.5).translate([width / 2, height / 1.6]);
      }
      pathGenerator.projection(projection);
    }

    function applyTheme(theme) {
      currentTheme = theme;
      document.getElementById('opt-theme-noir').classList.toggle('active', theme === 'noir');
      document.getElementById('opt-theme-sand').classList.toggle('active', theme === 'sand');
      if (theme === 'sand') {
        document.body.classList.add('theme-sand');
      } else {
        document.body.classList.remove('theme-sand');
      }
    }

    function toggleSunlight(enable) {
      isSunlightOn = enable;
      document.getElementById('opt-sun-off').classList.toggle('active', !enable);
      document.getElementById('opt-sun-on').classList.toggle('active', enable);
    }

    function getSolarPosition() {
      const now = new Date();
      const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
      const declination = -23.44 * Math.cos((2 * Math.PI / 365) * (dayOfYear + 10));
      const utcHours = now.getUTCHours() + now.getUTCMinutes() / 60;
      const sunLng = (12 - utcHours) * 15;
      return [sunLng, declination];
    }

    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    let zoomLevel = 1.0; let targetZoom = 1.0;
    let panOffset = { x: 0, y: 0 }; let targetPan = { x: 0, y: 0 };
    let rotation = [0, 0]; let isDragging = false; let dragStart = { x: 0, y: 0 };
    let lastUserActionTime = Date.now(); const IDLE_ROTATION_DELAY = 3000;

    let hoveredCountryFeature = null; let hoverTimer = null;
    const tooltipEl = document.getElementById('country-tooltip');

    let projection = d3.geoMercator().scale(width / 6.5).translate([width / 2, height / 1.6]);
    const pathGenerator = d3.geoPath().projection(projection).context(ctx);

    canvas.addEventListener('pointerdown', e => { isDragging = true; dragStart = { x: e.clientX, y: e.clientY }; lastUserActionTime = Date.now(); });
    canvas.addEventListener('pointermove', e => {
      lastUserActionTime = Date.now();
      if (isDragging) {
        const dx = e.clientX - dragStart.x; const dy = e.clientY - dragStart.y;
        if (mapMode === '3D') {
          rotation[0] += dx * 0.4; rotation[1] -= dy * 0.4;
          projection.rotate([rotation[0], rotation[1]]);
        } else {
          panOffset.x += dx; panOffset.y += dy; targetPan.x = panOffset.x; targetPan.y = panOffset.y;
        }
        dragStart = { x: e.clientX, y: e.clientY }; return;
      }
      handlePointerHover(e, false);
    });
    canvas.addEventListener('pointerup', e => { isDragging = false; lastUserActionTime = Date.now(); handlePointerHover(e, true); });

    function handlePointerHover(e, isTap = false) {
      const rect = canvas.getBoundingClientRect();
      let mouseX = e.clientX - rect.left; let mouseY = e.clientY - rect.top;
      if (mapMode === '2D') { mouseX = (mouseX - panOffset.x) / zoomLevel; mouseY = (mouseY - panOffset.y) / zoomLevel; }

      const coords = projection.invert([mouseX, mouseY]);
      if (coords && worldGeoData) {
        const countries = topojson.feature(worldGeoData, worldGeoData.objects.countries);
        let found = null;
        for (let feature of countries.features) { if (d3.geoContains(feature, coords)) { found = feature; break; } }

        if (found !== hoveredCountryFeature || isTap) {
          hoveredCountryFeature = found; clearTimeout(hoverTimer);
          if (hoveredCountryFeature) {
            playHoverSound();
            const rawName = (hoveredCountryFeature.properties.name || '').toUpperCase().trim();
            const countryNameCN = COUNTRY_CN_NAME[rawName] || null;
            const displayName = countryNameCN ? `> ${rawName} / ${countryNameCN}` : `> ${rawName}`;
            if (isTap || e.pointerType === 'touch') {
              tooltipEl.innerText = displayName; tooltipEl.style.left = `${e.clientX}px`; tooltipEl.style.top = `${e.clientY}px`; tooltipEl.style.display = 'block';
            } else {
              tooltipEl.style.display = 'none';
              hoverTimer = setTimeout(() => { tooltipEl.innerText = displayName; tooltipEl.style.left = `${e.clientX}px`; tooltipEl.style.top = `${e.clientY}px`; tooltipEl.style.display = 'block'; }, 2000);
            }
          } else { tooltipEl.style.display = 'none'; }
        } else if (hoveredCountryFeature && tooltipEl.style.display === 'block') {
          tooltipEl.style.left = `${e.clientX}px`; tooltipEl.style.top = `${e.clientY}px`;
        }
      } else { hoveredCountryFeature = null; clearTimeout(hoverTimer); tooltipEl.style.display = 'none'; }
    }

    canvas.addEventListener('wheel', e => {
      e.preventDefault(); lastUserActionTime = Date.now();
      const delta = e.deltaY < 0 ? 0.05 : -0.05;
      targetZoom = Math.max(0.6, Math.min(targetZoom + delta, 6.0));
      if (mapMode === '3D') projection.scale(Math.min(width, height) / 2.4 * targetZoom);
    }, { passive: false });

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight;
      if (mapMode === '3D') projection.scale(Math.min(width, height) / 2.4 * targetZoom).translate([width / 2, height / 2]);
      else projection.translate([width / 2, height / 1.6]);
    });

    let worldGeoData = null;
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then(res => res.json()).then(data => { worldGeoData = data; fetchVisitedCities(); }).catch(e => fetchVisitedCities());

    let pulseTime = 0;
    function renderCanvas() {
      pulseTime += 0.03;
      if (mapMode === '2D') {
        zoomLevel += (targetZoom - zoomLevel) * 0.1; panOffset.x += (targetPan.x - panOffset.x) * 0.1; panOffset.y += (targetPan.y - panOffset.y) * 0.1;
      } else if (mapMode === '3D' && !isDragging && (Date.now() - lastUserActionTime > IDLE_ROTATION_DELAY)) {
        rotation[0] += 0.15; projection.rotate([rotation[0], rotation[1]]);
      }

      const styles = getComputedStyle(document.body);
      const canvasBg = styles.getPropertyValue('--canvas-bg').trim();
      const landBg = styles.getPropertyValue('--land-bg').trim();
      const strokeColor = styles.getPropertyValue('--stroke-color').trim();
      const gridColor = styles.getPropertyValue('--grid-color').trim();

      ctx.fillStyle = canvasBg; ctx.fillRect(0, 0, width, height);
      ctx.save();
      if (mapMode === '2D') { ctx.translate(panOffset.x, panOffset.y); ctx.scale(zoomLevel, zoomLevel); }

      ctx.fillStyle = gridColor;
      for (let x = -width; x < width * 2; x += 24) {
        for (let y = -height; y < height * 2; y += 24) {
          ctx.beginPath(); ctx.arc(x, y, 1, 0, Math.PI * 2); ctx.fill();
        }
      }

      if (mapMode === '3D') {
        const globeRadius = projection.scale(); const center = projection.translate();
        ctx.beginPath(); ctx.arc(center[0], center[1], globeRadius + 1.5, 0, Math.PI * 2);
        ctx.strokeStyle = currentTheme === 'sand' ? 'rgba(181, 168, 149, 0.6)' : 'rgba(255, 255, 255, 0.25)'; ctx.lineWidth = 1; ctx.stroke();
        ctx.beginPath(); ctx.arc(center[0], center[1], globeRadius, 0, Math.PI * 2);
        ctx.fillStyle = landBg; ctx.fill();
      }

      if (window.topojson && worldGeoData) {
        const countries = topojson.feature(worldGeoData, worldGeoData.objects.countries);
        ctx.beginPath(); pathGenerator(countries); ctx.fillStyle = landBg; ctx.fill();
        ctx.strokeStyle = strokeColor; ctx.lineWidth = 0.8 / (mapMode === '2D' ? zoomLevel : 1); ctx.stroke();

        const visitedCountrySet = new Set(visitedCities.map(c => cleanCountryName(c.country)));
        countries.features.forEach(feature => {
          const countryName = (feature.properties.name || '').toUpperCase();
          if (visitedCountrySet.has(countryName)) {
            ctx.beginPath(); pathGenerator(feature);
            ctx.fillStyle = currentTheme === 'sand' ? 'rgba(200, 50, 38, 0.15)' : 'rgba(255, 255, 255, 0.08)'; ctx.fill();
            ctx.strokeStyle = currentTheme === 'sand' ? 'rgba(200, 50, 38, 0.5)' : 'rgba(255, 255, 255, 0.3)'; ctx.stroke();
          }
        });

        if (isSunlightOn) {
          const sunPos = getSolarPosition();
          const sunCircle = d3.geoCircle().center(sunPos).radius(89)();
          ctx.beginPath(); pathGenerator(sunCircle);
          ctx.fillStyle = currentTheme === 'sand' ? 'rgba(255, 220, 100, 0.2)' : 'rgba(255, 255, 200, 0.12)';
          ctx.fill();
        }

        if (hoveredCountryFeature) {
          ctx.beginPath(); pathGenerator(hoveredCountryFeature);
          ctx.fillStyle = currentTheme === 'sand' ? 'rgba(0, 0, 0, 0.12)' : 'rgba(255, 255, 255, 0.22)'; ctx.fill();
          ctx.strokeStyle = currentTheme === 'sand' ? '#1a1714' : '#ffffff'; ctx.lineWidth = 1.2; ctx.stroke();
        }
      }

      visitedCities.forEach(city => {
        if (currentFilter !== 'ALL' && cleanCountryName(city.region) !== currentFilter) return;
        const pt = projection([city.lng, city.lat]); if (!pt) return;
        if (mapMode === '3D') {
          if (d3.geoDistance([city.lng, city.lat], projection.invert([width / 2, height / 2])) > Math.PI / 2) return;
        }

        const glowRadius = (10 + Math.sin(pulseTime) * 4) / (mapMode === '2D' ? Math.sqrt(zoomLevel) : 1);
        const gradient = ctx.createRadialGradient(pt[0], pt[1], 0, pt[0], pt[1], glowRadius);
        gradient.addColorStop(0, 'rgba(215, 25, 33, 1)');
        gradient.addColorStop(0.4, 'rgba(215, 25, 33, 0.4)');
        gradient.addColorStop(1, 'rgba(215, 25, 33, 0)');

        ctx.fillStyle = gradient; ctx.beginPath(); ctx.arc(pt[0], pt[1], glowRadius, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#D71921'; ctx.beginPath(); ctx.arc(pt[0], pt[1], 3, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = styles.getPropertyValue('--glyph-white').trim();
        ctx.font = '10px Space Mono'; ctx.fillText(`> ${city.city_name.toUpperCase()}`, pt[0] + 8, pt[1] + 3);
      });

      ctx.restore();
      requestAnimationFrame(renderCanvas);
    }

    renderCanvas();

    function switchView(view) {
      if (view === 'CARDS') {
        document.getElementById('cards-view').style.display = 'block';
        document.getElementById('btn-cards').classList.add('active'); document.getElementById('btn-world').classList.remove('active');
        renderCountryCards();
      } else {
        document.getElementById('cards-view').style.display = 'none';
        document.getElementById('btn-world').classList.add('active'); document.getElementById('btn-cards').classList.remove('active');
      }
    }

    async function fetchVisitedCities() {
      if (!supabaseClient) return;
      try {
        const { data } = await supabaseClient.from('visited_cities').select('*');
        if (data) {
          visitedCities = data;
          document.getElementById('city-count').innerText = visitedCities.length.toString().padStart(2, '0');
          updateWorldProgress();
        }
      } catch(e){}
    }

    function renderCountryCards() {
      const container = document.getElementById('cards-container'); container.innerHTML = '';
      const grouped = {};
      visitedCities.forEach(c => {
        const country = cleanCountryName(c.country);
        if (!grouped[country]) grouped[country] = [];
        grouped[country].push(c.city_name);
      });

      Object.keys(grouped).forEach(country => {
        const citiesList = grouped[country].join(', ');
        const bgImg = getCountryImageUrl(country);
        const flagCode = COUNTRY_FLAG_CODES[country] || 'un';
        const flagUrl = `https://flagcdn.com/w160/${flagCode}.png`;

        const card = document.createElement('div');
        card.className = 'flip-card-container';
        card.onclick = function() { playClickSound(); this.classList.toggle('flipped'); };
        card.innerHTML = `
          <div class="flip-card-inner">
            <div class="deep-card-front" style="background-image: url('${bgImg}');">
              <div class="deep-card-overlay"></div>
              <div class="deep-card-content">
                <div class="deep-card-title">#${country}</div>
                <div class="deep-card-cities">Cities: ${citiesList}</div>
              </div>
            </div>
            <div class="deep-card-back">
              <img class="flag-large-img" src="${flagUrl}" alt="${country} flag">
              <div class="flag-country-name">#${country}</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderCityManageList() {
      const container = document.getElementById('city-list-container');
      container.innerHTML = '';

      if (visitedCities.length === 0) {
        container.innerHTML = '<div style="color:#666; font-size:10px;">NO CITIES UNLOCKED YET.</div>';
        return;
      }

      visitedCities.forEach((city, index) => {
        const div = document.createElement('div');
        div.style.display = 'flex'; div.style.justifyContent = 'space-between'; div.style.alignItems = 'center';
        div.style.padding = '8px 0'; div.style.borderBottom = '1px dashed var(--border-color)'; div.style.fontSize = '10px';
        div.innerHTML = `
          <span>> ${city.city_name.toUpperCase()} (${city.country})</span>
          <span style="color:var(--glyph-red); cursor:pointer; font-weight:bold;" onclick="playClickSound(); deleteCity(${index})">[DEL]</span>
        `;
        container.appendChild(div);
      });
    }

    async function deleteCity(index) {
      if (!currentUser) return alert('請先登入管理員帳號！');
      const target = visitedCities[index];
      if (!confirm(`確定刪除 ${target.city_name} (${target.country})？`)) return;

      if (supabaseClient && target.id) {
        const { error } = await supabaseClient.from('visited_cities').delete().eq('id', target.id);
        if (error) return alert('DELETE ERROR: ' + error.message);
      }

      visitedCities.splice(index, 1);
      document.getElementById('city-count').innerText = visitedCities.length.toString().padStart(2, '0');
      updateWorldProgress();
      renderCityManageList();
    }
  </script>
</body>
</html>
