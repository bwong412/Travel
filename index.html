<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>3D Web FPS Game (Single & Multiplayer)</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 8px; height: 8px; background: rgba(0, 255, 0, 0.8);
      border-radius: 50%; transform: translate(-50%, -50%);
      pointer-events: none; z-index: 10;
    }
    #ui {
      position: absolute; bottom: 20px; left: 20px;
      color: white; font-size: 18px; text-shadow: 2px 2px 4px #000; z-index: 10;
    }
    #menu-panel {
      position: absolute; top: 20px; left: 20px;
      background: rgba(0, 0, 0, 0.85); color: white;
      padding: 15px; border-radius: 8px; z-index: 20; max-width: 300px;
    }
    #menu-panel button {
      padding: 8px 12px; font-size: 14px; margin-top: 5px; cursor: pointer;
      background: #008cba; color: white; border: none; border-radius: 4px;
    }
    #menu-panel button:hover { background: #005f73; }
    #instructions {
      position: absolute; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); color: white;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      cursor: pointer; z-index: 15;
    }
    .mode-btn { width: 100%; margin-bottom: 8px; font-weight: bold; }
  </style>
  <!-- 載入 Three.js & PeerJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="crosshair"></div>

  <!-- 選單面板 -->
  <div id="menu-panel">
    <h3 style="margin-top: 0;">遊戲模式選擇</h3>
    <button class="mode-btn" id="single-btn" style="background: #2ea44f;">單人模式 (AI 敵打靶)</button>
    <hr style="border-color: #444;">
    <div><strong>雙人連線 ID:</strong> <span id="my-id" style="color: #00ffcc;">建立中...</span></div>
    <div style="margin-top: 5px;">
      <input type="text" id="target-id" placeholder="貼上對方的房間 ID" style="width: 140px; padding: 5px;">
      <button id="connect-btn">連線對戰</button>
    </div>
    <div style="margin-top: 5px; font-size: 12px; color: #aaa;" id="status">目前模式: 未選擇</div>
  </div>

  <div id="ui">
    模式: <span id="game-mode-text">選單中</span> | 
    擊殺數: <span id="kills">0</span> | 
    當前武器: <span id="weapon-name">Rifle (AK-47)</span> (按 1 / 2 切換)
  </div>

  <div id="instructions">
    <h1>選擇模式後，點擊畫面開始遊戲</h1>
    <p>W, A, S, D 移動 | 滑鼠瞄準 | 左鍵開槍 | 1, 2 切換武器</p>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let peer, conn;
    let isSinglePlayer = false;
    let killCount = 0;

    // 玩家與 Bot 模型
    let enemyMesh;
    let botHP = 100;
    
    // 控制變數
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let prevTime = performance.now();
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();

    // 武器設定
    const weapons = {
      rifle: { name: 'Rifle (AK-47)', color: 0x8B4513, length: 0.8, damage: 35 },
      pistol: { name: 'Pistol (Glock)', color: 0x333333, length: 0.3, damage: 20 }
    };
    let currentWeaponKey = 'rifle';
    let gunMesh;

    init3D();
    initPeer();
    animate();

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

      // 光線
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(20, 40, 20);
      scene.add(dirLight);

      // 地板
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(100, 100),
        new THREE.MeshLambertMaterial({ color: 0x555555 })
      );
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // 掩體
      for(let i = 0; i < 12; i++) {
        const box = new THREE.Mesh(
          new THREE.BoxGeometry(2, 2, 2),
          new THREE.MeshLambertMaterial({ color: 0x888888 })
        );
        box.position.set((Math.random() - 0.5) * 40, 1, (Math.random() - 0.5) * 40);
        scene.add(box);
      }

      // 敵人模型 (可用於 P2P 對手 或 單人 Bot)
      enemyMesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.8, 1.8, 0.8),
        new THREE.MeshLambertMaterial({ color: 0xff0000 })
      );
      enemyMesh.position.set(0, -100, 0); // 預設隱藏
      scene.add(enemyMesh);

      // 控制器
      controls = new THREE.PointerLockControls(camera, document.body);
      const instructions = document.getElementById('instructions');
      instructions.addEventListener('click', () => {
        if (controls.enabled) controls.lock();
      });
      controls.addEventListener('lock', () => { instructions.style.display = 'none'; });
      controls.addEventListener('unlock', () => { instructions.style.display = 'flex'; });
      scene.add(controls.getObject());

      createGunMesh();

      // 事件
      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);
      document.addEventListener('mousedown', onShoot);

      // 單人模式按鈕事件
      document.getElementById('single-btn').addEventListener('click', startSinglePlayer);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
    }

    function startSinglePlayer() {
      isSinglePlayer = true;
      document.getElementById('game-mode-text').innerText = '單人練習';
      document.getElementById('status').innerText = '模式: 單人 Bot 模式';
      
      // 生成 Bot
      respawnBot();
      controls.lock();
    }

    function respawnBot() {
      botHP = 100;
      enemyMesh.position.set(
        (Math.random() - 0.5) * 30,
        0.9,
        (Math.random() - 0.5) * 30
      );
    }

    function createGunMesh() {
      if (gunMesh) camera.remove(gunMesh);
      const w = weapons[currentWeaponKey];
      gunMesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, 0.1, w.length),
        new THREE.MeshLambertMaterial({ color: w.color })
      );
      gunMesh.position.set(0.2, -0.2, -0.5);
      camera.add(gunMesh);
      document.getElementById('weapon-name').innerText = w.name;
    }

    function initPeer() {
      peer = new Peer();

      peer.on('open', (id) => {
        document.getElementById('my-id').innerText = id;
      });

      peer.on('connection', (incoming) => {
        conn = incoming;
        bindConnEvents();
        startMultiplayer();
      });

      document.getElementById('connect-btn').addEventListener('click', () => {
        const targetId = document.getElementById('target-id').value.trim();
        if (!targetId) return alert('請貼上房間 ID');
        conn = peer.connect(targetId);
        bindConnEvents();
        startMultiplayer();
      });
    }

    function startMultiplayer() {
      isSinglePlayer = false;
      document.getElementById('game-mode-text').innerText = '雙人連線';
      document.getElementById('status').innerText = '連線成功！';
    }

    function bindConnEvents() {
      conn.on('data', (data) => {
        if (data.type === 'move') {
          enemyMesh.position.set(data.x, data.y - 0.9, data.z);
          enemyMesh.rotation.y = data.ry;
        }
      });
      conn.on('close', () => {
        document.getElementById('status').innerText = '對方已離線';
        enemyMesh.position.set(0, -100, 0);
      });
    }

    function onKeyDown(e) {
      switch (e.code) {
        case 'KeyW': moveForward = true; break;
        case 'KeyS': moveBackward = true; break;
        case 'KeyA': moveLeft = true; break;
        case 'KeyD': moveRight = true; break;
        case 'Digit1': switchWeapon('rifle'); break;
        case 'Digit2': switchWeapon('pistol'); break;
      }
    }

    function onKeyUp(e) {
      switch (e.code) {
        case 'KeyW': moveForward = false; break;
        case 'KeyS': moveBackward = false; break;
        case 'KeyA': moveLeft = false; break;
        case 'KeyD': moveRight = false; break;
      }
    }

    function switchWeapon(type) {
      if (weapons[type] && currentWeaponKey !== type) {
        currentWeaponKey = type;
        createGunMesh();
      }
    }

    function onShoot(e) {
      if (!controls.isLocked || e.button !== 0) return;

      // 開槍動畫
      gunMesh.position.z += 0.05;
      setTimeout(() => gunMesh.position.z -= 0.05, 50);

      // 射擊判定 (Raycaster)
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      const intersects = raycaster.intersectObject(enemyMesh);
      if (intersects.length > 0) {
        const currentWeapon = weapons[currentWeaponKey];

        if (isSinglePlayer) {
          // 單人 Bot 模式：扣血判定
          botHP -= currentWeapon.damage;
          console.log('擊中 Bot！剩餘 HP:', botHP);

          // 擊中微閃光
          enemyMesh.material.color.setHex(0xffffff);
          setTimeout(() => enemyMesh.material.color.setHex(0xff0000), 100);

          if (botHP <= 0) {
            killCount++;
            document.getElementById('kills').innerText = killCount;
            respawnBot();
          }
        } else if (conn && conn.open) {
          // 雙人模式發送開槍封包
          conn.send({ type: 'shoot', weapon: currentWeaponKey });
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      if (controls.isLocked) {
        const time = performance.now();
        const delta = (time - prevTime) / 1000;

        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);

        const pos = controls.getObject().position;

        // --- 單人 AI 邏輯：Bot 朝玩家靠近 ---
        if (isSinglePlayer && enemyMesh.position.y > 0) {
          const botPos = enemyMesh.position;
          const dirToPlayer = new THREE.Vector3().subVectors(pos, botPos);
          dirToPlayer.y = 0; // 保持在平地上
          dirToPlayer.normalize();

          // Bot 緩慢向玩家移動
          botPos.addScaledVector(dirToPlayer, 2.0 * delta);
          enemyMesh.lookAt(pos.x, enemyMesh.position.y, pos.z);
        }

        // --- 雙人模式：同步座標 ---
        if (!isSinglePlayer && conn && conn.open) {
          conn.send({
            type: 'move',
            x: pos.x, y: pos.y, z: pos.z,
            ry: camera.rotation.y
          });
        }

        prevTime = time;
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
