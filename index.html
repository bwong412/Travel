<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Travel Map</title>
  
  <!-- Supabase & D3 Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-array@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

  <!-- Space Mono Font -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #000000;
      --panel-bg: rgba(12, 12, 12, 0.88);
      --glyph-white: #ffffff;
      --glyph-red: #D71921;
      --border-color: rgba(255, 255, 255, 0.15);
      --text-muted: #888888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Mono', monospace, -apple-system, "PingFang HK", "Microsoft JhengHei"; }
    html, body { width: 100%; height: 100%; background-color: var(--bg-color); color: var(--glyph-white); overflow: hidden; touch-action: none; }

    #world-canvas {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000000; z-index: 1; cursor: grab;
    }
    #world-canvas:active { cursor: grabbing; }

    /* Hover 2秒跳出的國家 Tooltip 懸浮框 (中英雙語) */
    .country-tooltip {
      position: absolute;
      display: none;
      pointer-events: none;
      z-index: 3000;
      background: rgba(15, 15, 15, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      transform: translate(15px, 15px);
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }

    /* Top Navigation Bar */
    .top-nav {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--border-color);
      backdrop-filter: blur(16px); padding: 4px 8px; border-radius: 30px;
      display: flex; gap: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      max-width: 90vw;
    }
    .nav-btn {
      background: transparent; border: none; color: #888; font-size: 10px;
      padding: 6px 12px; cursor: pointer; border-radius: 20px; letter-spacing: 1px;
      transition: all 0.2s; font-weight: bold; white-space: nowrap;
    }
    .nav-btn:hover, .nav-btn.active { background: #ffffff; color: #000000; }

    /* Dashboard Panel */
    .dashboard {
      position: absolute; top: 15px; left: 15px; z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--border-color);
      backdrop-filter: blur(16px); padding: 14px; border-radius: 8px; width: 220px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9); pointer-events: auto;
    }
    .brand-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px dashed var(--border-color); padding-bottom: 8px; margin-bottom: 10px; }
    .brand-title { font-size: 11px; letter-spacing: 1.5px; font-weight: bold; }
    .red-dot { width: 6px; height: 6px; background-color: var(--glyph-red); border-radius: 50%; box-shadow: 0 0 8px var(--glyph-red); }
    .stat-number { font-size: 28px; font-weight: bold; }
    .stat-label { font-size: 9px; color: var(--text-muted); letter-spacing: 1px; }

    /* Filter Chips */
    .filter-container { margin-top: 10px; border-top: 1px dashed var(--border-color); padding-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
    .filter-chip {
      background: #151515; border: 1px solid var(--border-color); color: #888;
      font-size: 8px; padding: 4px 6px; cursor: pointer; border-radius: 2px; letter-spacing: 0.5px;
    }
    .filter-chip:hover, .filter-chip.active { background: #fff; color: #000; font-weight: bold; }

    /* Manage Button */
    .manage-btn {
      width: 100%; margin-top: 10px; background: transparent; border: 1px solid var(--border-color);
      color: #aaa; font-size: 9px; padding: 6px; cursor: pointer; letter-spacing: 1px; text-align: center;
      border-radius: 4px; font-family: 'Space Mono', monospace; transition: all 0.2s;
    }
    .manage-btn:hover { border-color: #fff; color: #fff; background: rgba(255,255,255,0.05); }

    /* Pack Drawer */
    .pack-drawer {
      display: none; position: absolute; top: 220px; left: 15px; z-index: 999;
      background: rgba(15, 15, 15, 0.95); border: 1px solid var(--border-color);
      backdrop-filter: blur(20px); border-radius: 8px; width: 220px; max-height: 45vh;
      overflow-y: auto; padding: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.9);
      animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .drawer-title { font-size: 10px; font-weight: bold; color: var(--glyph-white); letter-spacing: 1px; margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 4px; }
    .drawer-country { font-size: 10px; font-weight: bold; color: #fff; margin-top: 8px; }
    .drawer-cities { font-size: 9px; color: #777; margin-bottom: 6px; line-height: 1.4; }

    /* Admin Login Button */
    .admin-btn {
      position: absolute; top: 15px; right: 15px; z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--border-color);
      color: var(--glyph-white); padding: 8px 12px; font-size: 9px;
      cursor: pointer; backdrop-filter: blur(12px); border-radius: 4px;
      letter-spacing: 1px; transition: all 0.2s; font-family: 'Space Mono', monospace;
    }
    .admin-btn:hover { border-color: var(--glyph-white); background: #1f1f1f; }
    .admin-btn.active { border-color: var(--glyph-red); color: var(--glyph-red); }

    /* Modals */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 2000;
      justify-content: center; align-items: center;
    }
    .modal {
      background: #0d0d0d; border: 1px solid #333;
      padding: 20px; width: 340px; max-height: 80vh; overflow-y: auto; border-radius: 6px; box-shadow: 0 0 40px rgba(0,0,0,0.9);
    }
    .modal h3 { font-size: 11px; margin-bottom: 12px; letter-spacing: 1px; color: #fff; }
    .modal label { font-size: 9px; color: #888; letter-spacing: 1px; display: block; margin-bottom: 4px; }
    .modal input, .modal select {
      width: 100%; background: #161616; border: 1px solid #333;
      color: #fff; padding: 8px; margin-bottom: 10px; font-size: 11px;
      font-family: 'Space Mono', monospace; border-radius: 2px;
    }
    .modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }
    .btn {
      flex: 1; padding: 8px; background: #fff; color: #000; border: none;
      font-weight: bold; cursor: pointer; font-size: 10px; letter-spacing: 1px;
    }
    .btn-cancel { background: transparent; color: #888; border: 1px solid #333; }

    .city-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid #222; font-size: 10px;
    }
    .city-actions span { cursor: pointer; margin-left: 10px; color: var(--glyph-red); font-weight: bold; }
    .city-actions span:hover { text-decoration: underline; }

    /* Country Cards View Overlay */
    .cards-view-overlay {
      display: none; position: fixed; top: 70px; left: 0; width: 100vw; height: calc(100vh - 70px);
      z-index: 1500; background: rgba(0,0,0,0.94); backdrop-filter: blur(20px);
      padding: 20px; overflow-y: auto;
    }
    .cards-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px;
      max-width: 1100px; margin: 0 auto;
    }

    /* 3D Flip Card Container */
    .flip-card-container {
      perspective: 1000px;
      height: 380px;
      cursor: pointer;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }

    .flip-card-container.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .deep-card-front, .deep-card-back {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden !important;
      backface-visibility: hidden !important;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
    }

    .deep-card-front {
      background-size: cover;
      background-position: center;
      background-color: #1a1a1a;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
      z-index: 2;
    }

    .deep-card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.5) 45%, rgba(0,0,0,0.95) 100%);
      z-index: 1;
    }

    .deep-card-content { position: relative; z-index: 2; }
    .deep-card-title { font-size: 22px; font-weight: 700; letter-spacing: 1px; color: #ffffff; margin-bottom: 6px; }
    .deep-card-cities { font-size: 11px; color: #b0b0b0; line-height: 1.5; margin-bottom: 14px; min-height: 33px; }
    
    .progress-info-row { display: flex; justify-content: space-between; font-size: 9px; color: #aaa; margin-bottom: 6px; font-weight: bold; letter-spacing: 0.5px; }
    .progress-bar-bg {
      width: 100%; height: 6px; background: rgba(255, 255, 255, 0.15); border-radius: 4px; overflow: hidden;
      backdrop-filter: blur(4px);
    }
    .progress-bar-fill {
      height: 100%; background: #ffffff; border-radius: 4px; transition: width 0.8s ease;
    }
    .progress-bar-fill.full {
      background: #ffffff; box-shadow: 0 0 10px #ffffff;
    }

    .deep-card-back {
      transform: rotateY(180deg);
      background-color: #0a0a0a !important;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 1;
    }

    .flag-large-img {
      width: 150px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 16px;
    }

    .flag-country-name {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #ffffff;
    }

    @media (max-width: 600px) {
      .dashboard { top: 60px; left: 15px; width: calc(100vw - 30px); }
      .pack-drawer { top: 280px; left: 15px; width: calc(100vw - 30px); }
      .admin-btn { top: 15px; right: 15px; }
    }
  </style>
</head>

  <!-- Tooltip 懸浮框 -->
  <div class="country-tooltip" id="country-tooltip"></div>

  <!-- Top Navigation -->
  <div class="top-nav">
    <button class="nav-btn active" id="btn-world" onclick="switchView('MAP')">[ WORLD MAP ]</button>
    <button class="nav-btn" id="btn-cards" onclick="switchView('CARDS')">[ COUNTRY CARDS ]</button>
  </div>

  <!-- Dashboard Panel -->
  <div class="dashboard" id="main-dashboard">
    <div class="brand-header">
      <span class="brand-title">Travel Map</span>
      <div class="red-dot"></div>
    </div>
    <div class="stat-number" id="city-count">00</div>
    <div class="stat-label">CITIES UNLOCKED</div>

    <!-- Filter Buttons -->
    <div class="filter-container">
      <div class="filter-chip active" onclick="setFilter('ALL', this)">ALL</div>
      <div class="filter-chip" onclick="setFilter('ASIA', this)">ASIA</div>
      <div class="filter-chip" onclick="setFilter('EUROPE', this)">EUROPE</div>
      <div class="filter-chip" onclick="setFilter('AMERICAS', this)">AMERICAS</div>
      <div class="filter-chip" onclick="setFilter('AFRICA', this)">AFRICA</div>
      <div class="filter-chip" onclick="setFilter('OCEANIA', this)">OCEANIA</div>
    </div>

    <button class="manage-btn" onclick="openManageModal()">[ EDIT / DELETE CITIES ]</button>
  </div>

  <!-- Pack Drawer -->
  <div class="pack-drawer" id="pack-drawer">
    <div class="drawer-title" id="drawer-title">REGION // PACK</div>
    <div id="drawer-content"></div>
  </div>

  <!-- Admin Login Button -->
  <button class="admin-btn" id="admin-btn" onclick="openLoginModal()">[ LOGIN ]</button>

  <!-- Login Modal -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal">
      <h3>ADMIN // AUTHENTICATION</h3>
      <label>EMAIL</label>
      <input type="email" id="login-email" placeholder="admin@example.com">
      <label>PASSWORD</label>
      <input type="password" id="login-password" placeholder="••••••••">
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeLoginModal()">CANCEL</button>
        <button class="btn" onclick="handleLogin()">LOGIN</button>
      </div>
    </div>
  </div>

  <!-- Add City Modal -->
  <div class="modal-overlay" id="add-city-modal">
    <div class="modal">
      <h3>ADD NEW UNLOCKED CITY</h3>
      <label>COORDINATES (LAT, LNG)</label>
      <input type="text" id="add-coords" placeholder="e.g. 35.67, 139.65">
      
      <label>CITY NAME</label>
      <input type="text" id="add-city-name" placeholder="e.g. TOKYO">
      
      <label>COUNTRY NAME</label>
      <input type="text" id="add-country-name" placeholder="e.g. JAPAN">
      
      <label>REGION / CONTINENT</label>
      <select id="add-region">
        <option value="ASIA">ASIA (赤紅光)</option>
        <option value="EUROPE">EUROPE (冰藍光)</option>
        <option value="AMERICAS">AMERICAS (純白光)</option>
        <option value="AFRICA">AFRICA (琥珀黃)</option>
        <option value="OCEANIA">OCEANIA (翡翠綠)</option>
      </select>

      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeAddCityModal()">CANCEL</button>
        <button class="btn" onclick="confirmAddCity()">SAVE CITY</button>
      </div>
    </div>
  </div>

  <!-- Manage / Delete City Modal -->
  <div class="modal-overlay" id="manage-modal">
    <div class="modal">
      <h3>MANAGE UNLOCKED CITIES</h3>
      <div id="city-list-container"></div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeManageModal()">CLOSE</button>
      </div>
    </div>
  </div>

    <div class="cards-grid" id="cards-container"></div>
  </div>

      '梵蒂岡': 1, 'VATICAN CITY': 1
    };

    const REGION_COLORS = {
      'ASIA': { core: '#FF5252', glow: 'rgba(215, 25, 33, ' },
      'EUROPE': { core: '#80D8FF', glow: 'rgba(0, 229, 255, ' },
      'AMERICAS': { core: '#FFFFFF', glow: 'rgba(255, 255, 255, ' },
      'AFRICA': { core: '#FFD740', glow: 'rgba(255, 179, 0, ' },
      'OCEANIA': { core: '#69F0AE', glow: 'rgba(0, 230, 118, ' }
    };

    function cleanCountryName(str) {
      if (!str) return 'UNKNOWN';
      return str.toString().toUpperCase().replace(/\s+/g, ' ').trim();
    }

    function getCountryImageUrl(countryName) {
      const cleaned = cleanCountryName(countryName);
      if (STATIC_LANDMARKS[cleaned]) return STATIC_LANDMARKS[cleaned];
      return `https://source.unsplash.com/800x600/?${encodeURIComponent(cleaned)},landmark,scenery`;
    }

    function switchView(view) {
      if (view === 'CARDS') {
        document.getElementById('cards-view').style.display = 'block';
        document.getElementById('btn-cards').classList.add('active');
        document.getElementById('btn-world').classList.remove('active');
        renderCountryCards();
      } else {
        document.getElementById('cards-view').style.display = 'none';
        document.getElementById('btn-world').classList.add('active');
        document.getElementById('btn-cards').classList.remove('active');
      }
    }

    function openLoginModal() { document.getElementById('login-modal').style.display = 'flex'; }
    function closeLoginModal() { document.getElementById('login-modal').style.display = 'none'; }
    function openManageModal() { renderCityManageList(); document.getElementById('manage-modal').style.display = 'flex'; }
    function closeManageModal() { document.getElementById('manage-modal').style.display = 'none'; }

    function openAddCityModal(lat, lng) {
      if (lat !== undefined && lng !== undefined) {
        document.getElementById('add-coords').value = `${lat.toFixed(2)}, ${lng.toFixed(2)}`;
        if (lng > 60 && lng < 150 && lat > 0) document.getElementById('add-region').value = 'ASIA';
        else if (lng > -15 && lng < 50 && lat > 35) document.getElementById('add-region').value = 'EUROPE';
        else if (lng < -30) document.getElementById('add-region').value = 'AMERICAS';
        else if (lng > -20 && lng < 55 && lat <= 35 && lat > -35) document.getElementById('add-region').value = 'AFRICA';
        else if (lng >= 110 && lat < 0) document.getElementById('add-region').value = 'OCEANIA';
      } else {
        document.getElementById('add-coords').value = '';
      }
      document.getElementById('add-city-name').value = '';
      document.getElementById('add-country-name').value = '';
      document.getElementById('add-city-modal').style.display = 'flex';
    }

    function closeAddCityModal() { document.getElementById('add-city-modal').style.display = 'none'; }

    async function handleLogin() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      if (!supabaseClient) return alert("Supabase Client Init Error");

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        alert('LOGIN FAILED: ' + error.message);
      } else {
        currentUser = data.user;
        document.getElementById('admin-btn').innerText = '[ ADMIN ON ]';
        document.getElementById('admin-btn').classList.add('active');
        closeLoginModal();
        alert('WELCOME BACK, ADMIN.');
      }
    }

    // Canvas Engine
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    let zoomLevel = 1.0;
    let targetZoom = 1.0;
    let panOffset = { x: 0, y: 0 };
    let targetPan = { x: 0, y: 0 };
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };

    let hoveredCountryFeature = null;
    let hoverTimer = null;
    const tooltipEl = document.getElementById('country-tooltip');

    const projection = d3.geoMercator().scale(width / 6.5).translate([width / 2, height / 1.6]);
    const pathGenerator = d3.geoPath().projection(projection).context(ctx);

    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStart = { x: e.clientX - panOffset.x, y: e.clientY - panOffset.y };
    });

    canvas.addEventListener('mousemove', (e) => {
      if (isDragging) {
        panOffset.x = e.clientX - dragStart.x;
        panOffset.y = e.clientY - dragStart.y;
        targetPan.x = panOffset.x;
        targetPan.y = panOffset.y;
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const mouseX = (e.clientX - rect.left - panOffset.x) / zoomLevel;
      const mouseY = (e.clientY - rect.top - panOffset.y) / zoomLevel;

      const coords = projection.invert([mouseX, mouseY]);

      if (coords && worldGeoData) {
        const countries = topojson.feature(worldGeoData, worldGeoData.objects.countries);
        let found = null;

        for (let feature of countries.features) {
          if (d3.geoContains(feature, coords)) {
            found = feature;
            break;
          }
        }

        if (found !== hoveredCountryFeature) {
          hoveredCountryFeature = found;
          clearTimeout(hoverTimer);
          tooltipEl.style.display = 'none';

          if (hoveredCountryFeature) {
            const rawName = (hoveredCountryFeature.properties.name || '').toUpperCase().trim();
            const countryNameCN = COUNTRY_CN_NAME[rawName] || null;
            
            // 2 秒後顯示中英雙語懸浮框
            hoverTimer = setTimeout(() => {
              const displayName = countryNameCN ? `> ${rawName} / ${countryNameCN}` : `> ${rawName}`;
              tooltipEl.innerText = displayName;
              tooltipEl.style.left = `${e.clientX}px`;
              tooltipEl.style.top = `${e.clientY}px`;
              tooltipEl.style.display = 'block';
            }, 2000);
          }
        } else if (hoveredCountryFeature && tooltipEl.style.display === 'block') {
          tooltipEl.style.left = `${e.clientX}px`;
          tooltipEl.style.top = `${e.clientY}px`;
        }
      } else {
        hoveredCountryFeature = null;
        clearTimeout(hoverTimer);
        tooltipEl.style.display = 'none';
      }
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.05 : -0.05;
      targetZoom = Math.max(0.6, Math.min(targetZoom + delta, 6.0));
    }, { passive: false });

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    function setFilter(region, element) {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      element.classList.add('active');
      currentFilter = region;

      if (region === 'ALL') {
        targetZoom = 1.0;
        targetPan = { x: 0, y: 0 };
      }

      const drawer = document.getElementById('pack-drawer');
      const drawerTitle = document.getElementById('drawer-title');
      const drawerContent = document.getElementById('drawer-content');

      if (region === 'ALL') {
        drawer.style.display = 'none';
        return;
      }

      drawerTitle.innerText = `${region} // PACK`;
      drawerContent.innerHTML = '';

      const filtered = visitedCities.filter(c => c.region === region);
      const grouped = {};
      filtered.forEach(c => {
        const country = cleanCountryName(c.country);
        if (!grouped[country]) grouped[country] = [];
        grouped[country].push(c.city_name);
      });

      const countries = Object.keys(grouped);
      if (countries.length === 0) {
        drawerContent.innerHTML = '<div style="font-size:9px; color:#666;">NO CITIES IN THIS REGION YET.</div>';
      } else {
        countries.forEach(country => {
          const div = document.createElement('div');
          div.innerHTML = `
            <div class="drawer-country">> ${country}</div>
            <div class="drawer-cities">${grouped[country].join(', ')}</div>
          `;
          drawerContent.appendChild(div);
        });
      }

      drawer.style.display = 'block';
    }

    let worldGeoData = null;
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then(res => res.json())
      .then(data => {
        worldGeoData = data;
        fetchVisitedCities();
      }).catch(e => fetchVisitedCities());

    let pulseTime = 0;
    function renderCanvas() {
      pulseTime += 0.03;

      zoomLevel += (targetZoom - zoomLevel) * 0.1;
      panOffset.x += (targetPan.x - panOffset.x) * 0.1;
      panOffset.y += (targetPan.y - panOffset.y) * 0.1;

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.translate(panOffset.x, panOffset.y);
      ctx.scale(zoomLevel, zoomLevel);

      ctx.fillStyle = '#181818';
      const gridSize = 24;
      for (let x = -width; x < width * 2; x += gridSize) {
        for (let y = -height; y < height * 2; y += gridSize) {
          ctx.beginPath();
          ctx.arc(x, y, 1, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (window.topojson && worldGeoData) {
        const countries = topojson.feature(worldGeoData, worldGeoData.objects.countries);
        
        ctx.beginPath();
        pathGenerator(countries);
        ctx.fillStyle = '#090909';
        ctx.fill();
        ctx.strokeStyle = '#222222';
        ctx.lineWidth = 0.8 / zoomLevel;
        ctx.stroke();

        const visitedCountrySet = new Set(visitedCities.map(c => cleanCountryName(c.country)));
        countries.features.forEach(feature => {
          const countryName = (feature.properties.name || '').toUpperCase();
          if (visitedCountrySet.has(countryName)) {
            ctx.beginPath();
            pathGenerator(feature);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.035)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
            ctx.stroke();
          }
        });

        /* 高級淡白微光 Hover 著燈效果 */
        if (hoveredCountryFeature) {
          ctx.beginPath();
          pathGenerator(hoveredCountryFeature);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
          ctx.lineWidth = 1.2 / zoomLevel;
          ctx.stroke();
        }
      }

      const labelBoxes = [];

      visitedCities.forEach(city => {
        if (currentFilter !== 'ALL' && city.region && city.region !== currentFilter) return;

        const pt = projection([city.lng, city.lat]);
        if (!pt) return;

        const regionTheme = REGION_COLORS[city.region || 'ASIA'] || REGION_COLORS['ASIA'];

        const glowRadius = (10 + Math.sin(pulseTime) * 4) / Math.sqrt(zoomLevel);
        const gradient = ctx.createRadialGradient(pt[0], pt[1], 0, pt[0], pt[1], glowRadius);
        gradient.addColorStop(0, regionTheme.glow + '1)');
        gradient.addColorStop(0.4, regionTheme.glow + '0.5)');
        gradient.addColorStop(1, regionTheme.glow + '0)');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(pt[0], pt[1], glowRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = regionTheme.core;
        ctx.beginPath();
        ctx.arc(pt[0], pt[1], 3 / Math.sqrt(zoomLevel), 0, Math.PI * 2);
        ctx.fill();

        const labelText = `> ${city.city_name.toUpperCase()}`;
        const labelX = pt[0] + 8 / zoomLevel;
        const labelY = pt[1] + 3 / zoomLevel;

        let hasOverlap = false;
        for (let box of labelBoxes) {
          if (Math.abs(box.x - labelX) < 40 / zoomLevel && Math.abs(box.y - labelY) < 12 / zoomLevel) {
            hasOverlap = true;
            break;
          }
        }

        if (!hasOverlap || zoomLevel > 2.0) {
          labelBoxes.push({ x: labelX, y: labelY });
          ctx.fillStyle = '#a0a0a0';
          ctx.font = `${Math.max(8, 10 / Math.sqrt(zoomLevel))}px Space Mono`;
          ctx.fillText(labelText, labelX, labelY);
        }
      });

      ctx.restore();
      requestAnimationFrame(renderCanvas);
    }

    renderCanvas();

    canvas.addEventListener('dblclick', (e) => {
      if (!currentUser) {
        alert('請先點擊右上角 [ LOGIN ] 登入管理員帳號！');
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left - panOffset.x) / zoomLevel;
      const clickY = (e.clientY - rect.top - panOffset.y) / zoomLevel;

      const coords = projection.invert([clickX, clickY]);
      if (!coords) return;

      openAddCityModal(coords[1], coords[0]);
    });

    async function confirmAddCity() {
      const coordsInput = document.getElementById('add-coords').value.trim();
      const cityName = document.getElementById('add-city-name').value.trim();
      const countryInput = document.getElementById('add-country-name').value;
      const region = document.getElementById('add-region').value;

      if (!coordsInput || !cityName) return alert('請填寫完整資訊！');

      const country = cleanCountryName(countryInput);
      const parts = coordsInput.split(',');
      const lat = parseFloat(parts[0].trim());
      const lng = parseFloat(parts[1].trim());

      if (supabaseClient) {
        const { data, error } = await supabaseClient.from('visited_cities').insert([
          {
            city_code: cityName.substring(0,3).toUpperCase() + Math.floor(Math.random() * 100),
            city_name: cityName,
            country: country,
            region: region,
            lat: lat,
            lng: lng,
            is_visited: true
          }
        ]).select();

        if (error) return alert('INSERT ERROR: ' + error.message);
        if (data) visitedCities.push(data[0]);
      } else {
        visitedCities.push({ city_name: cityName, country, region, lat, lng });
      }

      document.getElementById('city-count').innerText = visitedCities.length.toString().padStart(2, '0');
      closeAddCityModal();
    }

    function renderCityManageList() {
      const container = document.getElementById('city-list-container');
      container.innerHTML = '';

      if (visitedCities.length === 0) {
        container.innerHTML = '<div style="color:#666; font-size:10px;">NO CITIES UNLOCKED YET.</div>';
        return;
      }

      visitedCities.forEach((city, index) => {
        const div = document.createElement('div');
        div.className = 'city-item';
        div.innerHTML = `
          <span>> ${city.city_name.toUpperCase()} (${city.country})</span>
          <div class="city-actions">
            <span onclick="deleteCity(${index})">[DEL]</span>
          </div>
        `;
        container.appendChild(div);
      });
    }

    async function deleteCity(index) {
      if (!currentUser) return alert('請先登入管理員帳號！');
      const target = visitedCities[index];
      if (!confirm(`確定刪除 ${target.city_name} (${target.country})？`)) return;

      if (supabaseClient && target.id) {
        const { error } = await supabaseClient.from('visited_cities').delete().eq('id', target.id);
        if (error) return alert('DELETE ERROR: ' + error.message);
      }

      visitedCities.splice(index, 1);
      document.getElementById('city-count').innerText = visitedCities.length.toString().padStart(2, '0');
      renderCityManageList();
    }

    function renderCountryCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      const grouped = {};
      visitedCities.forEach(c => {
        const country = cleanCountryName(c.country);
        if (!grouped[country]) grouped[country] = [];
        grouped[country].push(c.city_name);
      });

      const countries = Object.keys(grouped);

      if (countries.length === 0) {
        container.innerHTML = '<div style="color:#666; font-size:12px;">NO CITIES UNLOCKED YET.</div>';
        return;
      }

      countries.forEach(country => {
        const citiesList = grouped[country].join(', ');
        const visitedCount = grouped[country].length;
        
        const targetCount = COUNTRY_TARGET_CITIES[country] || 10;
        const progressPercent = Math.min(100, Math.round((visitedCount / targetCount) * 100));
        const isFull = progressPercent >= 100;

        const bgImg = getCountryImageUrl(country);
        const flagCode = COUNTRY_FLAG_CODES[country] || 'un';
        const flagUrl = `https://flagcdn.com/w160/${flagCode}.png`;

        const card = document.createElement('div');
        card.className = 'flip-card-container';
        card.onclick = function() {
          this.classList.toggle('flipped');
        };

        card.innerHTML = `
          <div class="flip-card-inner">
            <!-- 正面 -->
            <div class="deep-card-front" style="background-image: url('${bgImg}');">
              <div class="deep-card-overlay"></div>
              <div class="deep-card-content">
                <div class="deep-card-title">#${country}</div>
                <div class="deep-card-cities">the cities has been to: ${citiesList}</div>
                
                <div class="progress-info-row">
                  <span>EXPLORED ${visitedCount}/${targetCount} CITIES</span>
                  <span>${progressPercent}%</span>
                </div>
                <div class="progress-bar-bg">
                  <div class="progress-bar-fill ${isFull ? 'full' : ''}" style="width: ${progressPercent}%;"></div>
                </div>
              </div>
            </div>

            <!-- 背面: 純黑色底色，只有國旗與乾淨國名 -->
            <div class="deep-card-back">
              <img class="flag-large-img" src="${flagUrl}" alt="${country} flag">
              <div class="flag-country-name">#${country}</div>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    async function fetchVisitedCities() {
      if (!supabaseClient) return;
      try {
        const { data, error } = await supabaseClient.from('visited_cities').select('*');
        if (error || !data) return;

        visitedCities = data;
        document.getElementById('city-count').innerText = visitedCities.length.toString().padStart(2, '0');
      } catch(e){}
    }
  </script>
</body>
</html>
