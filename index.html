<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLYPH // TRAVEL MAP</title>
  
  <!-- D3 & Supabase (極輕量 CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- NDOT Monospace Font -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #000000;
      --panel-bg: rgba(18, 18, 18, 0.9);
      --glyph-white: #ffffff;
      --glyph-red: #D71921;
      --border-color: #262626;
      --text-muted: #666666;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Mono', monospace; }
    html, body { width: 100%; height: 100%; background-color: var(--bg-color); color: var(--glyph-white); overflow: hidden; }

    /* SVG Canvas 地圖容器 */
    #map-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
    }

    svg {
      width: 100%;
      height: 100%;
      background: #000000;
    }

    /* 陸地與邊界線條 - Nothing Style */
    .country {
      fill: #0a0a0a;
      stroke: #222222;
      stroke-width: 0.8px;
      transition: fill 0.2s ease;
    }
    .country:hover {
      fill: #141414;
      stroke: #444444;
    }

    /* Dashboard UI */
    .dashboard {
      position: absolute; top: 20px; left: 20px; z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--border-color);
      backdrop-filter: blur(10px); padding: 20px; border-radius: 4px; width: 260px;
      box-shadow: 0 0 30px rgba(0,0,0,0.9);
    }
    .brand-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px dashed var(--border-color); padding-bottom: 10px; margin-bottom: 15px; }
    .brand-title { font-size: 12px; letter-spacing: 2px; }
    .red-dot { width: 8px; height: 8px; background-color: var(--glyph-red); border-radius: 50%; box-shadow: 0 0 10px var(--glyph-red); }
    .stat-number { font-size: 36px; font-weight: bold; }
    .stat-label { font-size: 10px; color: var(--text-muted); letter-spacing: 1px; margin-top: 4px; }

    /* Admin Button */
    .admin-btn {
      position: absolute; top: 20px; right: 20px; z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--border-color);
      color: var(--glyph-white); padding: 10px 16px; font-size: 11px;
      cursor: pointer; backdrop-filter: blur(10px); border-radius: 4px;
      letter-spacing: 1.5px; transition: all 0.2s;
    }
    .admin-btn:hover { border-color: var(--glyph-white); background: #1f1f1f; }
    .admin-btn.active { border-color: var(--glyph-red); color: var(--glyph-red); }

    /* Auth Modal */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 2000;
      justify-content: center; align-items: center;
    }
    .modal {
      background: #0d0d0d; border: 1px solid #333;
      padding: 30px; width: 320px; border-radius: 4px; box-shadow: 0 0 40px rgba(0,0,0,0.9);
    }
    .modal h3 { font-size: 13px; margin-bottom: 20px; letter-spacing: 1px; color: #fff; }
    .modal input {
      width: 100%; background: #161616; border: 1px solid #333;
      color: #fff; padding: 12px; margin-bottom: 15px; font-size: 12px;
    }
    .modal input:focus { outline: none; border-color: var(--glyph-white); }
    .modal-actions { display: flex; justify-content: space-between; gap: 10px; }
    .btn {
      flex: 1; padding: 12px; background: #fff; color: #000; border: none;
      font-weight: bold; cursor: pointer; font-size: 11px; letter-spacing: 1px;
    }
    .btn-cancel { background: transparent; color: #888; border: 1px solid #333; }

    /* LED Glow City Point */
    .glyph-point {
      fill: #ffffff;
      filter: drop-shadow(0 0 6px #ffffff) drop-shadow(0 0 12px #ffffff);
      animation: pulse-glow 2s infinite ease-in-out;
      cursor: pointer;
    }
    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 4px #ffffff) drop-shadow(0 0 8px #ffffff); opacity: 0.8; }
      50% { filter: drop-shadow(0 0 10px #ffffff) drop-shadow(0 0 20px #ffffff); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Dashboard UI -->
  <div class="dashboard">
    <div class="brand-header">
      <span class="brand-title">GLYPH // MAP</span>
      <div class="red-dot"></div>
    </div>
    <div class="stat-number" id="city-count">00</div>
    <div class="stat-label">CITIES UNLOCKED</div>
  </div>

  <!-- Admin Toggle Button -->
  <button class="admin-btn" id="admin-btn" onclick="toggleLoginModal()">[ LOGIN ]</button>

  <!-- Login Modal -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal">
      <h3>ADMIN // AUTHENTICATION</h3>
      <input type="email" id="login-email" placeholder="EMAIL">
      <input type="password" id="login-password" placeholder="PASSWORD">
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="toggleLoginModal()">CANCEL</button>
        <button class="btn" onclick="handleLogin()">LOGIN</button>
      </div>
    </div>
  </div>

  <!-- SVG Map Container -->
  <div id="map-container">
    <svg id="svg-map"></svg>
  </div>

  <script>
    // 1. Supabase Setup
    const SUPABASE_URL = 'https://pmrhldqgabasvohsupbn.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // 👈 貼上你喺 Supabase API Keys 複製到的 Key

    let supabase = null;
    if (SUPABASE_ANON_KEY && SUPABASE_ANON_KEY !== 'YOUR_SUPABASE_ANON_KEY') {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let currentUser = null;

    // Modal 開關邏輯 (原生 JavaScript，不依賴任何第三方庫)
    function toggleLoginModal() {
      const modal = document.getElementById('login-modal');
      modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
    }

    async function handleLogin() {
      if (!supabase) return alert('請先喺 index.html 第 129 行貼上 Supabase Key！');
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        alert('LOGIN FAILED: ' + error.message);
      } else {
        currentUser = data.user;
        document.getElementById('admin-btn').innerText = '[ ADMIN ON ]';
        document.getElementById('admin-btn').classList.add('active');
        toggleLoginModal();
        alert('WELCOME BACK, ADMIN.');
      }
    }

    // 2. D3 原生 SVG 極速地圖渲染
    const width = window.innerWidth;
    const height = window.innerHeight;

    const svg = d3.select("#svg-map")
      .attr("viewBox", [0, 0, width, height]);

    const projection = d3.geoMercator()
      .scale(width / 6.5)
      .translate([width / 2, height / 1.5]);

    const path = d3.geoPath().projection(projection);
    const g = svg.append("g");

    // 載入極輕量的世界地圖 TopoJSON (僅幾十 KB，載入速度極快)
    d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(data => {
      const countries = topojson.feature(data, data.objects.countries);

      g.selectAll("path")
        .data(countries.features)
        .enter().append("path")
        .attr("class", "country")
        .attr("d", path);

      // 地圖載入完成後讀取去過的城市數據
      fetchVisitedCities();
    });

    // 3. 點擊地圖地點新增城市
    svg.on("click", async function(event) {
      if (!currentUser) {
        alert("請先點擊右上角 [ LOGIN ] 登入管理員帳號！");
        return;
      }

      const coords = projection.invert(d3.pointer(event));
      const lng = coords[0];
      const lat = coords[1];

      const cityName = prompt(`[ADD CITY] Enter City Name at (${lat.toFixed(2)}, ${lng.toFixed(2)}):`);
      if (!cityName) return;

      const country = prompt(`[ADD CITY] Country Name:`) || '';

      if (supabase) {
        const { error } = await supabase.from('visited_cities').insert([
          {
            city_code: cityName.substring(0,3).toUpperCase() + Math.floor(Math.random() * 100),
            city_name: cityName,
            country: country,
            lat: lat,
            lng: lng,
            is_visited: true
          }
        ]);

        if (error) {
          alert('INSERT ERROR: ' + error.message);
          return;
        }
      }

      addGlyphPoint(lat, lng, cityName, country);
      updateCount(1);
    });

    function addGlyphPoint(lat, lng, cityName, country) {
      const pos = projection([lng, lat]);
      if (!pos) return;

      g.append("circle")
        .attr("cx", pos[0])
        .attr("cy", pos[1])
        .attr("r", 4)
        .attr("class", "glyph-point")
        .append("title")
        .text(`${cityName.toUpperCase()}, ${country.toUpperCase()}`);
    }

    function updateCount(addVal) {
      const countElem = document.getElementById('city-count');
      const current = parseInt(countElem.innerText);
      countElem.innerText = (current + addVal).toString().padStart(2, '0');
    }

    async function fetchVisitedCities() {
      if (!supabase) return;
      try {
        const { data, error } = await supabase.from('visited_cities').select('*');
        if (error || !data) return;

        document.getElementById('city-count').innerText = data.length.toString().padStart(2, '0');
        data.forEach(city => addGlyphPoint(city.lat, city.lng, city.city_name, city.country));
      } catch(e){}
    }
  </script>
</body>
</html>
