<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLYPH // TRAVEL MAP</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- NDOT / Monospace Font -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #000000;
      --panel-bg: rgba(18, 18, 18, 0.85);
      --glyph-white: #ffffff;
      --glyph-red: #D71921;
      --border-color: #333333;
      --text-muted: #888888;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--glyph-white);
      font-family: 'Space Mono', monospace;
      overflow: hidden;
    }

    #map {
      width: 100vw;
      height: 100vh;
      background: #090909;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Dashboard UI */
    .dashboard {
      position: absolute; top: 20px; left: 20px; z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--border-color);
      backdrop-filter: blur(10px); padding: 20px; border-radius: 4px; width: 260px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      pointer-events: auto;
    }
    .brand-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px dashed var(--border-color); padding-bottom: 10px; margin-bottom: 15px; }
    .brand-title { font-size: 12px; letter-spacing: 2px; }
    .red-dot { width: 8px; height: 8px; background-color: var(--glyph-red); border-radius: 50%; box-shadow: 0 0 8px var(--glyph-red); }
    .stat-number { font-size: 32px; font-weight: bold; }
    .stat-label { font-size: 10px; color: var(--text-muted); letter-spacing: 1px; }

    /* Right Admin Button */
    .admin-btn {
      position: absolute; top: 20px; right: 20px; z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--border-color);
      color: var(--glyph-white); padding: 8px 12px; font-size: 11px;
      cursor: pointer; backdrop-filter: blur(10px); border-radius: 4px;
      letter-spacing: 1px;
      font-family: 'Space Mono', monospace;
    }
    .admin-btn:hover { border-color: var(--glyph-white); }
    .admin-btn.active { border-color: var(--glyph-red); color: var(--glyph-red); }

    /* Auth Modal */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 2000;
      justify-content: center; align-items: center;
    }
    .modal {
      background: #0a0a0a; border: 1px solid var(--border-color);
      padding: 30px; width: 320px; border-radius: 4px;
    }
    .modal h3 { font-size: 13px; margin-bottom: 20px; letter-spacing: 1px; }
    .modal input {
      width: 100%; background: #151515; border: 1px solid var(--border-color);
      color: #fff; padding: 10px; margin-bottom: 15px; font-size: 12px;
      font-family: 'Space Mono', monospace;
    }
    .modal input:focus { outline: none; border-color: var(--glyph-white); }
    .modal-actions { display: flex; justify-content: space-between; gap: 10px; }
    .btn {
      flex: 1; padding: 10px; background: #fff; color: #000; border: none;
      font-weight: bold; cursor: pointer; font-size: 11px;
      font-family: 'Space Mono', monospace;
    }
    .btn-cancel { background: transparent; color: #888; border: 1px solid var(--border-color); }

    /* Glyph Marker Neon Glow */
    .glyph-marker {
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffffff, 0 0 15px #ffffff, 0 0 25px rgba(255,255,255,0.8);
      animation: pulse 2.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 8px #ffffff, 0 0 15px #ffffff; transform: scale(1); }
      50% { box-shadow: 0 0 15px #ffffff, 0 0 30px #ffffff, 0 0 40px #ffffff; transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <!-- Dashboard -->
  <div class="dashboard">
    <div class="brand-header">
      <span class="brand-title">GLYPH // MAP</span>
      <div class="red-dot"></div>
    </div>
    <div class="stat-number" id="city-count">00</div>
    <div class="stat-label">CITIES UNLOCKED</div>
  </div>

  <!-- Admin Button -->
  <button class="admin-btn" id="admin-btn" onclick="openLoginModal()">[ LOGIN ]</button>

  <!-- Login Modal -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal">
      <h3>ADMIN // AUTHENTICATION</h3>
      <input type="email" id="login-email" placeholder="EMAIL">
      <input type="password" id="login-password" placeholder="PASSWORD">
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeLoginModal()">CANCEL</button>
        <button class="btn" onclick="handleLogin()">LOGIN</button>
      </div>
    </div>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <script>
    // ⚠️ 記得將這兩行替換為你的 Supabase Project Credentials
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    
    let supabase = null;
    if (SUPABASE_URL !== 'YOUR_SUPABASE_URL' && SUPABASE_URL !== '') {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let currentUser = null;

    // 1. 初始化暗黑風格 Leaflet 地圖 (CartoDB Dark Matter)
    const map = L.map('map', { 
      zoomControl: false, 
      attributionControl: false 
    }).setView([20, 0], 2.5);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd'
    }).addTo(map);

    // 強制刷新地圖尺寸
    setTimeout(() => { map.invalidateSize(); }, 300);

    // 2. 檢查 Auth 狀態
    async function checkAuthStatus() {
      if (!supabase) return;
      const { data: { session } } = await supabase.auth.getSession();
      updateAdminUI(session ? session.user : null);
    }

    function updateAdminUI(user) {
      currentUser = user;
      const btn = document.getElementById('admin-btn');
      if (currentUser) {
        btn.innerText = '[ ADMIN ON ]';
        btn.classList.add('active');
        btn.onclick = handleLogout;
      } else {
        btn.innerText = '[ LOGIN ]';
        btn.classList.remove('active');
        btn.onclick = openLoginModal;
      }
    }

    function openLoginModal() { document.getElementById('login-modal').style.display = 'flex'; }
    function closeLoginModal() { document.getElementById('login-modal').style.display = 'none'; }

    async function handleLogin() {
      if (!supabase) return alert('請先喺 index.html 填入 Supabase URL 同 Key！');
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        alert('LOGIN FAILED: ' + error.message);
      } else {
        updateAdminUI(data.user);
        closeLoginModal();
        alert('WELCOME BACK, ADMIN.');
      }
    }

    async function handleLogout() {
      if (confirm('LOGOUT ADMIN?')) {
        await supabase.auth.signOut();
        updateAdminUI(null);
      }
    }

    // 3. 獲取已去的城市
    async function fetchVisitedCities() {
      if (!supabase) return;
      const { data, error } = await supabase.from('visited_cities').select('*');
      if (error) return console.error(error);

      document.getElementById('city-count').innerText = data.length.toString().padStart(2, '0');
      data.forEach(city => addGlyphMarker(city.lat, city.lng, city.city_name, city.country));
    }

    function addGlyphMarker(lat, lng, cityName, country) {
      const glyphIcon = L.divIcon({ className: 'glyph-marker', iconSize: [10, 10], iconAnchor: [5, 5] });
      const marker = L.marker([lat, lng], { icon: glyphIcon }).addTo(map);
      marker.bindPopup(`
        <div style="background:#000; color:#fff; padding:6px; font-family:'Space Mono'; font-size:11px; border:1px solid #333;">
          > ${(cityName || '').toUpperCase()}, ${(country || '').toUpperCase()}
        </div>
      `);
    }

    // 4. 點擊地圖新增城市（管理員登入後）
    map.on('click', async function(e) {
      if (!currentUser) {
        alert('請先點擊右上角 [ LOGIN ] 登入，才可以點擊新增去過的城市！');
        return;
      }

      const { lat, lng } = e.latlng;
      const cityName = prompt(`[ADMIN] ADD NEW CITY AT (${lat.toFixed(2)}, ${lng.toFixed(2)}):`);
      if (!cityName) return;

      const country = prompt(`[ADMIN] COUNTRY NAME:`) || '';

      if (supabase) {
        const { error } = await supabase.from('visited_cities').insert([
          {
            city_code: cityName.substring(0,3).toUpperCase() + Math.floor(Math.random() * 100),
            city_name: cityName,
            country: country,
            lat: lat,
            lng: lng,
            is_visited: true
          }
        ]);

        if (error) {
          alert('INSERT ERROR: ' + error.message);
          return;
        }
      }

      addGlyphMarker(lat, lng, cityName, country);
      const countElem = document.getElementById('city-count');
      countElem.innerText = (parseInt(countElem.innerText) + 1).toString().padStart(2, '0');
    });

    checkAuthStatus();
    fetchVisitedCities();
  </script>
</body>
</html>
