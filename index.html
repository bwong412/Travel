<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLYPH // TRAVEL MAP</title>
  
  <!-- Supabase & D3 Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-array@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

  <!-- Space Mono Font -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #000000;
      --panel-bg: rgba(15, 15, 15, 0.9);
      --glyph-white: #ffffff;
      --glyph-red: #D71921;
      --border-color: #2a2a2a;
      --text-muted: #666666;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Mono', monospace; }
    html, body { width: 100%; height: 100%; background-color: var(--bg-color); color: var(--glyph-white); overflow: hidden; }

    #world-canvas {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000000; z-index: 1; cursor: crosshair;
    }

    /* Dashboard Panel */
    .dashboard {
      position: absolute; top: 20px; left: 20px; z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--border-color);
      backdrop-filter: blur(12px); padding: 20px; border-radius: 4px; width: 280px;
      box-shadow: 0 0 30px rgba(0,0,0,0.9); pointer-events: auto;
    }
    .brand-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px dashed var(--border-color); padding-bottom: 10px; margin-bottom: 15px; }
    .brand-title { font-size: 12px; letter-spacing: 2px; }
    .red-dot { width: 8px; height: 8px; background-color: var(--glyph-red); border-radius: 50%; box-shadow: 0 0 10px var(--glyph-red); }
    .stat-number { font-size: 36px; font-weight: bold; }
    .stat-label { font-size: 10px; color: var(--text-muted); letter-spacing: 1px; margin-top: 4px; }

    /* Filter Menu */
    .filter-container { margin-top: 15px; border-top: 1px dashed var(--border-color); padding-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
    .filter-chip {
      background: #151515; border: 1px solid var(--border-color); color: #888;
      font-size: 9px; padding: 4px 8px; cursor: pointer; border-radius: 2px; letter-spacing: 1px;
    }
    .filter-chip:hover, .filter-chip.active { background: #fff; color: #000; font-weight: bold; }

    .manage-btn {
      width: 100%; margin-top: 12px; background: transparent; border: 1px solid var(--border-color);
      color: #aaa; font-size: 10px; padding: 6px; cursor: pointer; letter-spacing: 1px; text-align: center;
    }
    .manage-btn:hover { border-color: #fff; color: #fff; }

    .admin-btn {
      position: absolute; top: 20px; right: 20px; z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--border-color);
      color: var(--glyph-white); padding: 10px 16px; font-size: 11px;
      cursor: pointer; backdrop-filter: blur(12px); border-radius: 4px;
      letter-spacing: 1.5px; transition: all 0.2s; font-family: 'Space Mono', monospace;
    }
    .admin-btn:hover { border-color: var(--glyph-white); background: #1f1f1f; }
    .admin-btn.active { border-color: var(--glyph-red); color: var(--glyph-red); }

    /* Nothing Style Custom Dark Modals */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 2000;
      justify-content: center; align-items: center;
    }
    .modal {
      background: #0d0d0d; border: 1px solid #333;
      padding: 25px; width: 360px; max-height: 80vh; overflow-y: auto; border-radius: 4px; box-shadow: 0 0 40px rgba(0,0,0,0.9);
    }
    .modal h3 { font-size: 12px; margin-bottom: 15px; letter-spacing: 1px; color: #fff; }
    .modal label { font-size: 10px; color: #888; letter-spacing: 1px; display: block; margin-bottom: 4px; }
    .modal input, .modal select {
      width: 100%; background: #161616; border: 1px solid #333;
      color: #fff; padding: 10px; margin-bottom: 14px; font-size: 12px;
      font-family: 'Space Mono', monospace; border-radius: 2px;
    }
    .modal input:focus, .modal select:focus { outline: none; border-color: var(--glyph-white); }
    .modal-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; }
    .btn {
      flex: 1; padding: 10px; background: #fff; color: #000; border: none;
      font-weight: bold; cursor: pointer; font-size: 11px; letter-spacing: 1px;
    }
    .btn-cancel { background: transparent; color: #888; border: 1px solid #333; }

    .city-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid #222; font-size: 11px;
    }
    .city-actions span { cursor: pointer; margin-left: 10px; color: var(--glyph-red); }
    .city-actions span.edit { color: #888; }
    .city-actions span:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <!-- Dashboard UI -->
  <div class="dashboard">
    <div class="brand-header">
      <span class="brand-title">GLYPH // MAP</span>
      <div class="red-dot"></div>
    </div>
    <div class="stat-number" id="city-count">00</div>
    <div class="stat-label">CITIES UNLOCKED</div>

    <!-- Filter Buttons -->
    <div class="filter-container">
      <div class="filter-chip active" onclick="setFilter('ALL', this)">ALL</div>
      <div class="filter-chip" onclick="setFilter('ASIA', this)">ASIA</div>
      <div class="filter-chip" onclick="setFilter('EUROPE', this)">EUROPE</div>
      <div class="filter-chip" onclick="setFilter('AMERICAS', this)">AMERICAS</div>
      <div class="filter-chip" onclick="setFilter('AFRICA', this)">AFRICA</div>
      <div class="filter-chip" onclick="setFilter('OCEANIA', this)">OCEANIA</div>
    </div>

    <button class="manage-btn" onclick="openManageModal()">[ EDIT / DELETE CITIES ]</button>
  </div>

  <!-- Admin Login Button -->
  <button class="admin-btn" id="admin-btn" onclick="openLoginModal()">[ LOGIN ]</button>

  <!-- Login Modal -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal">
      <h3>ADMIN // AUTHENTICATION</h3>
      <label>EMAIL</label>
      <input type="email" id="login-email" placeholder="admin@example.com">
      <label>PASSWORD</label>
      <input type="password" id="login-password" placeholder="••••••••">
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeLoginModal()">CANCEL</button>
        <button class="btn" onclick="handleLogin()">LOGIN</button>
      </div>
    </div>
  </div>

  <!-- Custom Dark Modal for Adding City (取代白底 Prompt) -->
  <div class="modal-overlay" id="add-city-modal">
    <div class="modal">
      <h3>ADD NEW UNLOCKED CITY</h3>
      <label>COORDINATES</label>
      <input type="text" id="add-coords" readonly style="color: #666; background: #111;">
      
      <label>CITY NAME</label>
      <input type="text" id="add-city-name" placeholder="e.g. TOKYO">
      
      <label>COUNTRY NAME</label>
      <input type="text" id="add-country-name" placeholder="e.g. JAPAN">
      
      <label>REGION / CONTINENT</label>
      <select id="add-region">
        <option value="ASIA">ASIA (亞洲)</option>
        <option value="EUROPE">EUROPE (歐洲)</option>
        <option value="AMERICAS">AMERICAS (美洲)</option>
        <option value="AFRICA">AFRICA (非洲)</option>
        <option value="OCEANIA">OCEANIA (大洋洲)</option>
      </select>

      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeAddCityModal()">CANCEL</button>
        <button class="btn" onclick="confirmAddCity()">SAVE CITY</button>
      </div>
    </div>
  </div>

  <!-- Manage Modal -->
  <div class="modal-overlay" id="manage-modal">
    <div class="modal">
      <h3>MANAGE UNLOCKED CITIES</h3>
      <div id="city-list-container"></div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeManageModal()">CLOSE</button>
      </div>
    </div>
  </div>

  <!-- Canvas Map -->
  <canvas id="world-canvas"></canvas>

  <script>
    const SUPABASE_URL = 'https://pmrhldqgabasvohsupbn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_R9BjF5Dl_puhHVzvPwd7sA_vwRJwO_E';

    let supabaseClient = null;
    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch(e){}

    let currentUser = null;
    let visitedCities = [];
    let currentFilter = 'ALL';
    let pendingCoords = null;

    function openLoginModal() { document.getElementById('login-modal').style.display = 'flex'; }
    function closeLoginModal() { document.getElementById('login-modal').style.display = 'none'; }
    function openManageModal() { renderCityManageList(); document.getElementById('manage-modal').style.display = 'flex'; }
    function closeManageModal() { document.getElementById('manage-modal').style.display = 'none'; }

    function openAddCityModal(lat, lng) {
      pendingCoords = { lat, lng };
      document.getElementById('add-coords').value = `${lat.toFixed(2)}, ${lng.toFixed(2)}`;
      document.getElementById('add-city-name').value = '';
      document.getElementById('add-country-name').value = '';
      
      // 根據點擊經緯度自動預判大洲，免去手選麻煩
      if (lng > 60 && lng < 150 && lat > 0) document.getElementById('add-region').value = 'ASIA';
      else if (lng > -15 && lng < 50 && lat > 35) document.getElementById('add-region').value = 'EUROPE';
      else if (lng < -30) document.getElementById('add-region').value = 'AMERICAS';
      else if (lng > -20 && lng < 55 && lat <= 35 && lat > -35) document.getElementById('add-region').value = 'AFRICA';
      else if (lng >= 110 && lat < 0) document.getElementById('add-region').value = 'OCEANIA';

      document.getElementById('add-city-modal').style.display = 'flex';
    }

    function closeAddCityModal() {
      document.getElementById('add-city-modal').style.display = 'none';
      pendingCoords = null;
    }

    async function handleLogin() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      if (!supabaseClient) return alert("Supabase Client Init Error");

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        alert('LOGIN FAILED: ' + error.message);
      } else {
        currentUser = data.user;
        document.getElementById('admin-btn').innerText = '[ ADMIN ON ]';
        document.getElementById('admin-btn').classList.add('active');
        closeLoginModal();
        alert('WELCOME BACK, ADMIN.');
      }
    }

    // Canvas Engine
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    let centerPos = [width / 2, height / 1.6];
    let scaleVal = width / 6.5;

    const projection = d3.geoMercator().scale(scaleVal).translate(centerPos);
    const pathGenerator = d3.geoPath().projection(projection).context(ctx);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      updateProjection();
    });

    function updateProjection() {
      projection.scale(scaleVal).translate(centerPos);
    }

    function setFilter(region, element) {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      element.classList.add('active');
      currentFilter = region;

      if (region === 'ASIA') {
        scaleVal = width / 3.5; centerPos = [width * 0.1, height * 1.1];
      } else if (region === 'EUROPE') {
        scaleVal = width / 3.2; centerPos = [width * 0.45, height * 1.5];
      } else if (region === 'AMERICAS') {
        scaleVal = width / 4.0; centerPos = [width * 0.85, height * 0.9];
      } else if (region === 'AFRICA') {
        scaleVal = width / 3.8; centerPos = [width * 0.4, height * 0.7];
      } else if (region === 'OCEANIA') {
        scaleVal = width / 3.5; centerPos = [width * -0.2, height * 0.3];
      } else {
        scaleVal = width / 6.5; centerPos = [width / 2, height / 1.6];
      }
      updateProjection();
    }

    let worldGeoData = null;
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then(res => res.json())
      .then(data => {
        worldGeoData = data;
        fetchVisitedCities();
      }).catch(e => fetchVisitedCities());

    let pulseTime = 0;
    function renderCanvas() {
      pulseTime += 0.03;
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      // Dot Matrix Background
      ctx.fillStyle = '#181818';
      const gridSize = 24;
      for (let x = 0; x < width; x += gridSize) {
        for (let y = 0; y < height; y += gridSize) {
          ctx.beginPath();
          ctx.arc(x, y, 1, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Render World Map Boundaries
      if (window.topojson && worldGeoData) {
        const countries = topojson.feature(worldGeoData, worldGeoData.objects.countries);
        ctx.beginPath();
        pathGenerator(countries);
        ctx.fillStyle = '#090909';
        ctx.fill();
        ctx.strokeStyle = '#262626';
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }

      // Render Filtered Glow Cities
      visitedCities.forEach(city => {
        if (currentFilter !== 'ALL' && city.region && city.region !== currentFilter) return;

        const pt = projection([city.lng, city.lat]);
        if (!pt) return;

        const glowRadius = 10 + Math.sin(pulseTime) * 4;
        const gradient = ctx.createRadialGradient(pt[0], pt[1], 0, pt[0], pt[1], glowRadius);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
        gradient.addColorStop(0.3, 'rgba(255, 255, 255, 0.6)');
        gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(pt[0], pt[1], glowRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(pt[0], pt[1], 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#a0a0a0';
        ctx.font = '10px Space Mono';
        ctx.fillText(`> ${city.city_name.toUpperCase()}`, pt[0] + 10, pt[1] + 4);
      });

      requestAnimationFrame(renderCanvas);
    }

    renderCanvas();

    // Click Canvas to Trigger Custom Dark Modal
    canvas.addEventListener('click', (e) => {
      if (!currentUser) {
        alert('請先點擊右上角 [ LOGIN ] 登入管理員帳號！');
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const coords = projection.invert([x, y]);
      if (!coords) return;

      openAddCityModal(coords[1], coords[0]);
    });

    async function confirmAddCity() {
      if (!pendingCoords) return;

      const cityName = document.getElementById('add-city-name').value.trim();
      const country = document.getElementById('add-country-name').value.trim();
      const region = document.getElementById('add-region').value;

      if (!cityName) return alert('請輸入城市名稱！');

      const { lat, lng } = pendingCoords;

      if (supabaseClient) {
        const { data, error } = await supabaseClient.from('visited_cities').insert([
          {
            city_code: cityName.substring(0,3).toUpperCase() + Math.floor(Math.random() * 100),
            city_name: cityName,
            country: country,
            region: region,
            lat: lat,
            lng: lng,
            is_visited: true
          }
        ]).select();

        if (error) {
          alert('INSERT ERROR: ' + error.message);
          return;
        }
        if (data) visitedCities.push(data[0]);
      } else {
        visitedCities.push({ city_name: cityName, country, region, lat, lng });
      }

      document.getElementById('city-count').innerText = visitedCities.length.toString().padStart(2, '0');
      closeAddCityModal();
    }

    function renderCityManageList() {
      const container = document.getElementById('city-list-container');
      container.innerHTML = '';

      if (visitedCities.length === 0) {
        container.innerHTML = '<div style="color:#666; font-size:11px;">NO CITIES UNLOCKED YET.</div>';
        return;
      }

      visitedCities.forEach((city, index) => {
        const div = document.createElement('div');
        div.className = 'city-item';
        div.innerHTML = `
          <span>> ${city.city_name.toUpperCase()} [${city.region || 'ASIA'}]</span>
          <div class="city-actions">
            <span onclick="deleteCity(${index})">[DEL]</span>
          </div>
        `;
        container.appendChild(div);
      });
    }

    async function deleteCity(index) {
      if (!currentUser) return alert('請先登入管理員！');
      const target = visitedCities[index];
      if (!confirm(`Confirm to delete ${target.city_name}?`)) return;

      if (supabaseClient && target.id) {
        const { error } = await supabaseClient.from('visited_cities').delete().eq('id', target.id);
        if (error) return alert('DELETE ERROR: ' + error.message);
      }

      visitedCities.splice(index, 1);
      document.getElementById('city-count').innerText = visitedCities.length.toString().padStart(2, '0');
      renderCityManageList();
    }

    async function fetchVisitedCities() {
      if (!supabaseClient) return;
      try {
        const { data, error } = await supabaseClient.from('visited_cities').select('*');
        if (error || !data) return;

        visitedCities = data;
        document.getElementById('city-count').innerText = visitedCities.length.toString().padStart(2, '0');
      } catch(e){}
    }
  </script>
</body>
</html>
