<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>3D P2P Web FPS Game</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 8px; height: 8px; background: rgba(0, 255, 0, 0.8);
      border-radius: 50%; transform: translate(-50%, -50%);
      pointer-events: none; z-index: 10;
    }
    #ui {
      position: absolute; bottom: 20px; left: 20px;
      color: white; font-size: 18px; text-shadow: 2px 2px 4px #000; z-index: 10;
    }
    #connection-panel {
      position: absolute; top: 20px; left: 20px;
      background: rgba(0, 0, 0, 0.8); color: white;
      padding: 15px; border-radius: 8px; z-index: 20;
    }
    #connection-panel input, #connection-panel button {
      padding: 6px 10px; font-size: 14px; margin-top: 5px;
    }
    #instructions {
      position: absolute; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); color: white;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      cursor: pointer; z-index: 15;
    }
  </style>
  <!-- 載入 Three.js & PeerJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="crosshair"></div>

  <!-- 連線設定面板 -->
  <div id="connection-panel">
    <div><strong>你的房間 ID:</strong> <span id="my-id" style="color: #00ffcc;">建立中...</span></div>
    <div style="margin-top: 10px;">
      <input type="text" id="target-id" placeholder="貼上對方的房間 ID">
      <button id="connect-btn">連線對戰</button>
    </div>
    <div style="margin-top: 5px; font-size: 12px; color: #aaa;" id="status">等待連線...</div>
  </div>

  <div id="ui">
    當前武器: <span id="weapon-name">Rifle (AK-47)</span> (按 1 / 2 切換)
  </div>

  <div id="instructions">
    <h1>連線成功後點擊畫面開始</h1>
    <p>W, A, S, D 移動 | 滑鼠瞄準 | 左鍵開槍 | 1, 2 切換武器</p>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let peer, conn;
    let enemyMesh;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let prevTime = performance.now();
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();

    // 武器資料
    const weapons = {
      rifle: { name: 'Rifle (AK-47)', color: 0x8B4513, length: 0.8 },
      pistol: { name: 'Pistol (Glock)', color: 0x333333, length: 0.3 }
    };
    let currentWeaponKey = 'rifle';
    let gunMesh;

    init3D();
    initPeer();
    animate();

    // --- 1. Three.js 3D 場景建構 ---
    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

      // 光線
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(20, 40, 20);
      scene.add(dirLight);

      // 地板
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(100, 100),
        new THREE.MeshLambertMaterial({ color: 0x555555 })
      );
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // 掩體/障礙物
      for(let i = 0; i < 12; i++) {
        const box = new THREE.Mesh(
          new THREE.BoxGeometry(2, 2, 2),
          new THREE.MeshLambertMaterial({ color: 0x888888 })
        );
        box.position.set((Math.random() - 0.5) * 40, 1, (Math.random() - 0.5) * 40);
        scene.add(box);
      }

      // 建立敵方玩家模型 (預設隱藏)
      enemyMesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.8, 1.8, 0.8),
        new THREE.MeshLambertMaterial({ color: 0xff0000 })
      );
      enemyMesh.position.set(0, -100, 0); // 先藏在地下
      scene.add(enemyMesh);

      // 控制器
      controls = new THREE.PointerLockControls(camera, document.body);
      const instructions = document.getElementById('instructions');
      instructions.addEventListener('click', () => controls.lock());
      controls.addEventListener('lock', () => { instructions.style.display = 'none'; });
      controls.addEventListener('unlock', () => { instructions.style.display = 'flex'; });
      scene.add(controls.getObject());

      createGunMesh();

      // 事件監聽
      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);
      document.addEventListener('mousedown', onShoot);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
    }

    function createGunMesh() {
      if (gunMesh) camera.remove(gunMesh);
      const w = weapons[currentWeaponKey];
      gunMesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, 0.1, w.length),
        new THREE.MeshLambertMaterial({ color: w.color })
      );
      gunMesh.position.set(0.2, -0.2, -0.5);
      camera.add(gunMesh);
      document.getElementById('weapon-name').innerText = w.name;
    }

    // --- 2. PeerJS P2P 連線 ---
    function initPeer() {
      peer = new Peer();

      peer.on('open', (id) => {
        document.getElementById('my-id').innerText = id;
      });

      // 接收來自對方的連線 (Host)
      peer.on('connection', (incoming) => {
        conn = incoming;
        bindConnEvents();
        document.getElementById('status').innerText = '玩家已連入！';
      });

      // 主動連線對手 (Client)
      document.getElementById('connect-btn').addEventListener('click', () => {
        const targetId = document.getElementById('target-id').value.trim();
        if (!targetId) return alert('請貼上對方的房間 ID');
        document.getElementById('status').innerText = '正在連線中...';
        conn = peer.connect(targetId);
        bindConnEvents();
      });
    }

    function bindConnEvents() {
      conn.on('open', () => {
        document.getElementById('status').innerText = 'P2P 連線成功！可以開始對戰！';
      });

      // 接收對手傳來的數據
      conn.on('data', (data) => {
        if (data.type === 'move') {
          enemyMesh.position.set(data.x, data.y - 0.9, data.z); // 修正中心點高低
          enemyMesh.rotation.y = data.ry;
        } else if (data.type === 'shoot') {
          // 開槍效果 (敵方開槍)
          console.log('敵方使用了 ' + data.weapon + ' 開槍！');
        }
      });

      conn.on('close', () => {
        document.getElementById('status').innerText = '對方已離線';
        enemyMesh.position.set(0, -100, 0);
      });
    }

    // --- 3. 操控與射擊邏輯 ---
    function onKeyDown(e) {
      switch (e.code) {
        case 'KeyW': moveForward = true; break;
        case 'KeyS': moveBackward = true; break;
        case 'KeyA': moveLeft = true; break;
        case 'KeyD': moveRight = true; break;
        case 'Digit1': switchWeapon('rifle'); break;
        case 'Digit2': switchWeapon('pistol'); break;
      }
    }

    function onKeyUp(e) {
      switch (e.code) {
        case 'KeyW': moveForward = false; break;
        case 'KeyS': moveBackward = false; break;
        case 'KeyA': moveLeft = false; break;
        case 'KeyD': moveRight = false; break;
      }
    }

    function switchWeapon(type) {
      if (weapons[type] && currentWeaponKey !== type) {
        currentWeaponKey = type;
        createGunMesh();
      }
    }

    function onShoot(e) {
      if (!controls.isLocked || e.button !== 0) return;
      
      // 開槍動畫
      gunMesh.position.z += 0.05;
      setTimeout(() => gunMesh.position.z -= 0.05, 50);

      // 廣播開槍事件給對手
      if (conn && conn.open) {
        conn.send({ type: 'shoot', weapon: currentWeaponKey });
      }
    }

    // --- 4. 遊戲主迴圈 ---
    function animate() {
      requestAnimationFrame(animate);

      if (controls.isLocked) {
        const time = performance.now();
        const delta = (time - prevTime) / 1000;

        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);

        // 同步位置給對手
        const pos = controls.getObject().position;
        if (conn && conn.open) {
          conn.send({
            type: 'move',
            x: pos.x, y: pos.y, z: pos.z,
            ry: camera.rotation.y
          });
        }

        prevTime = time;
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
