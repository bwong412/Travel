<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLYPH // TRAVEL MAP</title>
  
  <!-- Supabase & D3 Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-array@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

  <!-- Space Mono Font -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #000000;
      --panel-bg: rgba(15, 15, 15, 0.85);
      --glyph-white: #ffffff;
      --glyph-red: #D71921;
      --border-color: #2a2a2a;
      --text-muted: #666666;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Mono', monospace; }
    html, body { width: 100%; height: 100%; background-color: var(--bg-color); color: var(--glyph-white); overflow: hidden; }

    #world-canvas {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000000; z-index: 1; cursor: grab;
    }
    #world-canvas:active { cursor: grabbing; }

    /* Top Navigation Bar */
    .top-nav {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--border-color);
      backdrop-filter: blur(16px); padding: 6px 12px; border-radius: 30px;
      display: flex; gap: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }
    .nav-btn {
      background: transparent; border: none; color: #888; font-size: 11px;
      padding: 8px 16px; cursor: pointer; border-radius: 20px; letter-spacing: 1.5px;
      transition: all 0.2s; font-weight: bold;
    }
    .nav-btn:hover, .nav-btn.active { background: #ffffff; color: #000000; }

    /* Dashboard Panel */
    .dashboard {
      position: absolute; top: 20px; left: 20px; z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--border-color);
      backdrop-filter: blur(12px); padding: 20px; border-radius: 4px; width: 260px;
      box-shadow: 0 0 30px rgba(0,0,0,0.9); pointer-events: auto;
    }
    .brand-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px dashed var(--border-color); padding-bottom: 10px; margin-bottom: 15px; }
    .brand-title { font-size: 12px; letter-spacing: 2px; }
    .red-dot { width: 8px; height: 8px; background-color: var(--glyph-red); border-radius: 50%; box-shadow: 0 0 10px var(--glyph-red); }
    .stat-number { font-size: 36px; font-weight: bold; }
    .stat-label { font-size: 10px; color: var(--text-muted); letter-spacing: 1px; margin-top: 4px; }

    /* Filter Menu */
    .filter-container { margin-top: 15px; border-top: 1px dashed var(--border-color); padding-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
    .filter-chip {
      background: #151515; border: 1px solid var(--border-color); color: #888;
      font-size: 9px; padding: 4px 8px; cursor: pointer; border-radius: 2px; letter-spacing: 1px;
    }
    .filter-chip:hover, .filter-chip.active { background: #fff; color: #000; font-weight: bold; }

    .admin-btn {
      position: absolute; top: 20px; right: 20px; z-index: 1000;
      background: var(--panel-bg); border: 1px solid var(--border-color);
      color: var(--glyph-white); padding: 10px 16px; font-size: 11px;
      cursor: pointer; backdrop-filter: blur(12px); border-radius: 4px;
      letter-spacing: 1.5px; transition: all 0.2s; font-family: 'Space Mono', monospace;
    }
    .admin-btn:hover { border-color: var(--glyph-white); background: #1f1f1f; }
    .admin-btn.active { border-color: var(--glyph-red); color: var(--glyph-red); }

    /* Dark Modals */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 2000;
      justify-content: center; align-items: center;
    }
    .modal {
      background: #0d0d0d; border: 1px solid #333;
      padding: 25px; width: 360px; max-height: 80vh; overflow-y: auto; border-radius: 4px; box-shadow: 0 0 40px rgba(0,0,0,0.9);
    }
    .modal h3 { font-size: 12px; margin-bottom: 15px; letter-spacing: 1px; color: #fff; }
    .modal label { font-size: 10px; color: #888; letter-spacing: 1px; display: block; margin-bottom: 4px; }
    .modal input, .modal select {
      width: 100%; background: #161616; border: 1px solid #333;
      color: #fff; padding: 10px; margin-bottom: 14px; font-size: 12px;
      font-family: 'Space Mono', monospace; border-radius: 2px;
    }
    .modal-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; }
    .btn {
      flex: 1; padding: 10px; background: #fff; color: #000; border: none;
      font-weight: bold; cursor: pointer; font-size: 11px; letter-spacing: 1px;
    }
    .btn-cancel { background: transparent; color: #888; border: 1px solid #333; }

    /* Frosted Liquid Country Cards Grid View */
    .cards-view-overlay {
      display: none; position: fixed; top: 80px; left: 0; width: 100vw; height: calc(100vh - 80px);
      z-index: 1500; background: rgba(0,0,0,0.92); backdrop-filter: blur(20px);
      padding: 40px; overflow-y: auto;
    }
    .cards-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px;
      max-width: 1200px; margin: 0 auto;
    }
    
    /* 液態磨砂卡片 */
    .frosted-card {
      position: relative; background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px;
      padding: 24px; overflow: hidden; backdrop-filter: blur(15px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: transform 0.3s, border-color 0.3s;
      cursor: pointer; height: 180px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .frosted-card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.4); }
    .frosted-card.full-unlocked { border-color: #00E5FF; box-shadow: 0 0 25px rgba(0, 229, 255, 0.3); }

    /* 水流動態背景 (Liquid Water Wave) */
    .liquid-bg {
      position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(180deg, rgba(0, 162, 255, 0.4) 0%, rgba(0, 81, 255, 0.6) 100%);
      transition: height 1s ease-in-out; z-index: 0;
    }
    .liquid-wave {
      position: absolute; top: -12px; left: 0; width: 200%; height: 20px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,0 C150,90 350,-40 500,40 C650,120 900,10 1200,40 L1200,120 L0,120 Z" fill="%2300a2ff" opacity="0.5"></path></svg>') repeat-x;
      animation: wave 4s linear infinite;
    }
    @keyframes wave { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    .card-content { position: relative; z-index: 2; }
    .card-country { font-size: 16px; font-weight: bold; letter-spacing: 2px; }
    .card-stats { font-size: 11px; color: #aaa; margin-top: 4px; }
    .card-percent { font-size: 32px; font-weight: bold; margin-top: 12px; letter-spacing: 1px; }
  </style>
</head>
<body>

  <!-- Top Function Navigation Bar -->
  <div class="top-nav">
    <button class="nav-btn active" id="btn-world" onclick="switchView('MAP')">[ WORLD MAP ]</button>
    <button class="nav-btn" id="btn-cards" onclick="switchView('CARDS')">[ COUNTRY CARDS ]</button>
  </div>

  <!-- Dashboard Panel -->
  <div class="dashboard" id="main-dashboard">
    <div class="brand-header">
      <span class="brand-title">GLYPH // MAP</span>
      <div class="red-dot"></div>
    </div>
    <div class="stat-number" id="city-count">00</div>
    <div class="stat-label">CITIES UNLOCKED</div>

    <!-- Filter Buttons -->
    <div class="filter-container">
      <div class="filter-chip active" onclick="setFilter('ALL', this)">ALL</div>
      <div class="filter-chip" onclick="setFilter('ASIA', this)">ASIA</div>
      <div class="filter-chip" onclick="setFilter('EUROPE', this)">EUROPE</div>
      <div class="filter-chip" onclick="setFilter('AMERICAS', this)">AMERICAS</div>
      <div class="filter-chip" onclick="setFilter('AFRICA', this)">AFRICA</div>
      <div class="filter-chip" onclick="setFilter('OCEANIA', this)">OCEANIA</div>
    </div>
  </div>

  <!-- Admin Login Button -->
  <button class="admin-btn" id="admin-btn" onclick="openLoginModal()">[ LOGIN ]</button>

  <!-- Login Modal -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal">
      <h3>ADMIN // AUTHENTICATION</h3>
      <label>EMAIL</label>
      <input type="email" id="login-email" placeholder="admin@example.com">
      <label>PASSWORD</label>
      <input type="password" id="login-password" placeholder="••••••••">
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeLoginModal()">CANCEL</button>
        <button class="btn" onclick="handleLogin()">LOGIN</button>
      </div>
    </div>
  </div>

  <!-- Add City Modal -->
  <div class="modal-overlay" id="add-city-modal">
    <div class="modal">
      <h3>ADD NEW UNLOCKED CITY</h3>
      <label>COORDINATES (LAT, LNG)</label>
      <input type="text" id="add-coords" placeholder="e.g. 35.67, 139.65">
      
      <label>CITY NAME</label>
      <input type="text" id="add-city-name" placeholder="e.g. TOKYO">
      
      <label>COUNTRY NAME</label>
      <input type="text" id="add-country-name" placeholder="e.g. JAPAN">
      
      <label>REGION / CONTINENT</label>
      <select id="add-region">
        <option value="ASIA">ASIA (赤紅光)</option>
        <option value="EUROPE">EUROPE (冰藍光)</option>
        <option value="AMERICAS">AMERICAS (純白光)</option>
        <option value="AFRICA">AFRICA (琥珀黃)</option>
        <option value="OCEANIA">OCEANIA (翡翠綠)</option>
      </select>

      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeAddCityModal()">CANCEL</button>
        <button class="btn" onclick="confirmAddCity()">SAVE CITY</button>
      </div>
    </div>
  </div>

  <!-- Country Cards Liquid View Overlay -->
  <div class="cards-view-overlay" id="cards-view">
    <div class="cards-grid" id="cards-container"></div>
  </div>

  <!-- Interactive Canvas Map -->
  <canvas id="world-canvas"></canvas>

  <script>
    const SUPABASE_URL = 'https://pmrhldqgabasvohsupbn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_R9BjF5Dl_puhHVzvPwd7sA_vwRJwO_E';

    let supabaseClient = null;
    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch(e){}

    let currentUser = null;
    let visitedCities = [];
    let currentFilter = 'ALL';

    const REGION_COLORS = {
      'ASIA': { core: '#FF5252', glow: 'rgba(215, 25, 33, ' },
      'EUROPE': { core: '#80D8FF', glow: 'rgba(0, 229, 255, ' },
      'AMERICAS': { core: '#FFFFFF', glow: 'rgba(255, 255, 255, ' },
      'AFRICA': { core: '#FFD740', glow: 'rgba(255, 179, 0, ' },
      'OCEANIA': { core: '#69F0AE', glow: 'rgba(0, 230, 118, ' }
    };

    function switchView(view) {
      if (view === 'CARDS') {
        document.getElementById('cards-view').style.display = 'block';
        document.getElementById('btn-cards').classList.add('active');
        document.getElementById('btn-world').classList.remove('active');
        renderCountryCards();
      } else {
        document.getElementById('cards-view').style.display = 'none';
        document.getElementById('btn-world').classList.add('active');
        document.getElementById('btn-cards').classList.remove('active');
      }
    }

    function openLoginModal() { document.getElementById('login-modal').style.display = 'flex'; }
    function closeLoginModal() { document.getElementById('login-modal').style.display = 'none'; }

    function openAddCityModal(lat, lng) {
      if (lat !== undefined && lng !== undefined) {
        document.getElementById('add-coords').value = `${lat.toFixed(2)}, ${lng.toFixed(2)}`;
        if (lng > 60 && lng < 150 && lat > 0) document.getElementById('add-region').value = 'ASIA';
        else if (lng > -15 && lng < 50 && lat > 35) document.getElementById('add-region').value = 'EUROPE';
        else if (lng < -30) document.getElementById('add-region').value = 'AMERICAS';
        else if (lng > -20 && lng < 55 && lat <= 35 && lat > -35) document.getElementById('add-region').value = 'AFRICA';
        else if (lng >= 110 && lat < 0) document.getElementById('add-region').value = 'OCEANIA';
      } else {
        document.getElementById('add-coords').value = '';
      }
      document.getElementById('add-city-name').value = '';
      document.getElementById('add-country-name').value = '';
      document.getElementById('add-city-modal').style.display = 'flex';
    }

    function closeAddCityModal() { document.getElementById('add-city-modal').style.display = 'none'; }

    async function handleLogin() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      if (!supabaseClient) return alert("Supabase Client Init Error");

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        alert('LOGIN FAILED: ' + error.message);
      } else {
        currentUser = data.user;
        document.getElementById('admin-btn').innerText = '[ ADMIN ON ]';
        document.getElementById('admin-btn').classList.add('active');
        closeLoginModal();
        alert('WELCOME BACK, ADMIN.');
      }
    }

    // Smooth Canvas Smooth Drag & Zoom Engine
    const canvas = document.getElementById('world-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    let zoomLevel = 1.0;
    let panOffset = { x: 0, y: 0 };
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };

    const projection = d3.geoMercator().scale(width / 6.5).translate([width / 2, height / 1.6]);
    const pathGenerator = d3.geoPath().projection(projection).context(ctx);

    // Mouse Dragging Smoothness
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStart = { x: e.clientX - panOffset.x, y: e.clientY - panOffset.y };
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      panOffset.x = e.clientX - dragStart.x;
      panOffset.y = e.clientY - dragStart.y;
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // Smooth Scroll Zoom
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      zoomLevel = Math.max(0.6, Math.min(zoomLevel * zoomFactor, 8.0));
    }, { passive: false });

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    function setFilter(region, element) {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      element.classList.add('active');
      currentFilter = region;
    }

    let worldGeoData = null;
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then(res => res.json())
      .then(data => {
        worldGeoData = data;
        fetchVisitedCities();
      }).catch(e => fetchVisitedCities());

    let pulseTime = 0;
    function renderCanvas() {
      pulseTime += 0.03;
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.translate(panOffset.x, panOffset.y);
      ctx.scale(zoomLevel, zoomLevel);

      // Dot Matrix Background
      ctx.fillStyle = '#181818';
      const gridSize = 24;
      for (let x = -width; x < width * 2; x += gridSize) {
        for (let y = -height; y < height * 2; y += gridSize) {
          ctx.beginPath();
          ctx.arc(x, y, 1, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // World Map Boundaries
      if (window.topojson && worldGeoData) {
        const countries = topojson.feature(worldGeoData, worldGeoData.objects.countries);
        ctx.beginPath();
        pathGenerator(countries);
        ctx.fillStyle = '#090909';
        ctx.fill();
        ctx.strokeStyle = '#262626';
        ctx.lineWidth = 0.8 / zoomLevel;
        ctx.stroke();
      }

      // 城市文字碰撞檢測陣列 (Collision Detection Box)
      const labelBoxes = [];

      visitedCities.forEach(city => {
        if (currentFilter !== 'ALL' && city.region && city.region !== currentFilter) return;

        const pt = projection([city.lng, city.lat]);
        if (!pt) return;

        const regionTheme = REGION_COLORS[city.region || 'ASIA'] || REGION_COLORS['ASIA'];

        // Glow Point
        const glowRadius = (10 + Math.sin(pulseTime) * 4) / Math.sqrt(zoomLevel);
        const gradient = ctx.createRadialGradient(pt[0], pt[1], 0, pt[0], pt[1], glowRadius);
        gradient.addColorStop(0, regionTheme.glow + '1)');
        gradient.addColorStop(0.4, regionTheme.glow + '0.5)');
        gradient.addColorStop(1, regionTheme.glow + '0)');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(pt[0], pt[1], glowRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = regionTheme.core;
        ctx.beginPath();
        ctx.arc(pt[0], pt[1], 3 / Math.sqrt(zoomLevel), 0, Math.PI * 2);
        ctx.fill();

        // 防止密集文字重疊 (Collision Check Logic)
        const labelText = `> ${city.city_name.toUpperCase()}`;
        const labelX = pt[0] + 8 / zoomLevel;
        const labelY = pt[1] + 3 / zoomLevel;

        let hasOverlap = false;
        for (let box of labelBoxes) {
          if (Math.abs(box.x - labelX) < 40 / zoomLevel && Math.abs(box.y - labelY) < 12 / zoomLevel) {
            hasOverlap = true;
            break;
          }
        }

        if (!hasOverlap || zoomLevel > 2.0) {
          labelBoxes.push({ x: labelX, y: labelY });
          ctx.fillStyle = '#a0a0a0';
          ctx.font = `${Math.max(8, 10 / Math.sqrt(zoomLevel))}px Space Mono`;
          ctx.fillText(labelText, labelX, labelY);
        }
      });

      ctx.restore();
      requestAnimationFrame(renderCanvas);
    }

    renderCanvas();

    // Click Canvas to Add
    canvas.addEventListener('click', (e) => {
      if (isDragging && (Math.abs(panOffset.x) > 5 || Math.abs(panOffset.y) > 5)) return;
      if (!currentUser) {
        alert('請先點擊右上角 [ LOGIN ] 登入管理員帳號！');
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left - panOffset.x) / zoomLevel;
      const clickY = (e.clientY - rect.top - panOffset.y) / zoomLevel;

      const coords = projection.invert([clickX, clickY]);
      if (!coords) return;

      openAddCityModal(coords[1], coords[0]);
    });

    async function confirmAddCity() {
      const coordsInput = document.getElementById('add-coords').value.trim();
      const cityName = document.getElementById('add-city-name').value.trim();
      const country = document.getElementById('add-country-name').value.trim();
      const region = document.getElementById('add-region').value;

      if (!coordsInput || !cityName) return alert('請填寫完整資訊！');

      const parts = coordsInput.split(',');
      const lat = parseFloat(parts[0].trim());
      const lng = parseFloat(parts[1].trim());

      if (supabaseClient) {
        const { data, error } = await supabaseClient.from('visited_cities').insert([
          {
            city_code: cityName.substring(0,3).toUpperCase() + Math.floor(Math.random() * 100),
            city_name: cityName,
            country: country,
            region: region,
            lat: lat,
            lng: lng,
            is_visited: true
          }
        ]).select();

        if (error) return alert('INSERT ERROR: ' + error.message);
        if (data) visitedCities.push(data[0]);
      } else {
        visitedCities.push({ city_name: cityName, country, region, lat, lng });
      }

      document.getElementById('city-count').innerText = visitedCities.length.toString().padStart(2, '0');
      closeAddCityModal();
    }

    // 渲染高級磨砂液態卡片 (Frosted Liquid Cards Renderer)
    function renderCountryCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      // 統計各國家城市數量
      const countryStats = {};
      visitedCities.forEach(c => {
        const country = (c.country || 'UNKNOWN').toUpperCase();
        countryStats[country] = (countryStats[country] || 0) + 1;
      });

      // 預設各國目標城市總數 (可自訂)
      const TARGET_CITIES = { 'JAPAN': 10, 'NEW ZEALAND': 7, 'CHINA': 20, 'USA': 15, 'UNITED KINGDOM': 8, 'FRANCE': 6 };

      const countries = Object.keys(countryStats);

      if (countries.length === 0) {
        container.innerHTML = '<div style="color:#666; font-size:12px;">NO CITIES UNLOCKED YET.</div>';
        return;
      }

      countries.forEach(country => {
        const count = countryStats[country];
        const target = TARGET_CITIES[country] || 10;
        const percent = Math.min(100, Math.round((count / target) * 100));

        const isFull = percent >= 100;

        const card = document.createElement('div');
        card.className = `frosted-card ${isFull ? 'full-unlocked' : ''}`;

        card.innerHTML = `
          <div class="liquid-bg" style="height: ${percent}%;">
            <div class="liquid-wave"></div>
          </div>
          <div class="card-content">
            <div class="card-country">${country}</div>
            <div class="card-stats">${count} / ${target} CITIES EXPLORED</div>
          </div>
          <div class="card-content">
            <div class="card-percent" style="color: ${isFull ? '#00E5FF' : '#ffffff'};">
              ${percent}% ${isFull ? '✦ FULL' : ''}
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    async function fetchVisitedCities() {
      if (!supabaseClient) return;
      try {
        const { data, error } = await supabaseClient.from('visited_cities').select('*');
        if (error || !data) return;

        visitedCities = data;
        document.getElementById('city-count').innerText = visitedCities.length.toString().padStart(2, '0');
      } catch(e){}
    }
  </script>
</body>
</html>
